name: TSS IRC regression tests

on:
  pull_request:
    paths:
      - "research-center/**"
      - "api/tss-irc-daily.js"
      - "lib/tssIrc*.mjs"
      - "scripts/tss-irc-handoff.mjs"
      - "tests/tssIrc*.test.mjs"
      - ".github/workflows/tss-irc-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "research-center/**"
      - "api/tss-irc-daily.js"
      - "lib/tssIrc*.mjs"
      - "scripts/tss-irc-handoff.mjs"
      - "tests/tssIrc*.test.mjs"

jobs:
  irc-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/tssIrc*.test.mjs
