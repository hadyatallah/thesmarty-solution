name: WhatsApp webhook security tests
on:
  push:
    paths: ['api/tss-whatsapp-webhook.js', 'lib/tssWhatsapp*.mjs', 'tests/tssWhatsapp*.test.mjs', '.github/workflows/tss-whatsapp-webhook-tests.yml']
  pull_request:
    paths: ['api/tss-whatsapp-webhook.js', 'lib/tssWhatsapp*.mjs', 'tests/tssWhatsapp*.test.mjs', '.github/workflows/tss-whatsapp-webhook-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tests/tssWhatsapp*.test.mjs
      - name: Inspect live test-only webhook response with nonsecret canary
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --max-time 20 --retry 2 --output /dev/null --write-out '%{http_code}' --get \
            --data-urlencode 'hub.mode=subscribe' \
            --data-urlencode 'hub.verify_token=TSS_PUBLIC_NONSECRET_CANARY_20261021' \
            --data-urlencode 'hub.challenge=PUBLIC_TEST_ONLY' \
            'https://www.thesmartysolution.com/api/tss-whatsapp-webhook')"
          echo "TSS_WEBHOOK_INVALID_CHALLENGE_HTTP=$status"
          case "$status" in
            403) echo "Probe reached configured challenge validation." ;;
            503) echo "Probe blocked by disabled endpoint or Google dependencies." ;;
            000) echo "Probe could not reach endpoint." ;;
            *) echo "Probe returned HTTP $status; investigate before Meta verification." ;;
          esac
          # Informational smoke step: no Meta secret or auth material used.
