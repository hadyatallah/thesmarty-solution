name: Temporary session source assembly
on:
  pull_request:
    branches: [main]
    paths: ['.session-candidate-input/**', '.github/workflows/session-assemble.yml']
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'hadyatallah/thesmarty-solution' && github.event.pull_request.number == 46 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/tss-session-continuity-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble checksum-verified source only
        run: |
          set -euo pipefail
          mkdir -p evidence/session-assembly
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,zlib
          text=''.join(Path(f'.session-candidate-input/{i}.b64').read_text() for i in range(4))
          assert hashlib.sha256(text.encode()).hexdigest()=='9c67c54b74bce1d7c6d423fabeaba9e931cfa26384895d0572078c013acbf756','Input checksum mismatch'
          manifest=json.loads(zlib.decompress(base64.b64decode(text,validate=True)))
          allowed={'.github/workflows/session-continuity.yml','api/crm-command.js','api/crm-research.js','api/crm-session.js','api/outlook/disconnect.js','api/outlook/oauth/start.js','api/outlook/send/approve.js','api/outlook/send/propose.js','api/outlook/status.js','crm/command-center.js','crm/index.html','crm/outlook-send.js','crm/session-continuity.js','server/crm-session/core.js','tests/session-browser.py','tests/session-client.test.mjs','tests/session-fixture-server.mjs','tests/session-server.test.mjs','tests/session-support.mjs'}
          assert len(manifest)==len(allowed) and {x['path'] for x in manifest}==allowed
          prepared=[]
          for entry in manifest:
            path=Path(entry['path']); before=entry['before']
            if before is None:
              assert not path.exists(),str(path)
              lines=[]
            else:
              data=path.read_bytes();assert hashlib.sha256(data).hexdigest()==before,'Baseline mismatch: '+str(path)
              lines=data.decode().splitlines(keepends=True)
            for edit in reversed(entry['edits']):
              assert 0<=edit['start']<=edit['end']<=len(lines)
              lines[edit['start']:edit['end']]=edit['text'].splitlines(keepends=True)
            after=''.join(lines).encode()
            assert hashlib.sha256(after).hexdigest()==entry['after'],'Candidate mismatch: '+str(path)
            prepared.append((path,after))
          for path,data in prepared:
            path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          Path('evidence/session-assembly/input-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          node --check server/crm-session/core.js
          node --check crm/session-continuity.js
          node --test tests/session-*.test.mjs | tee evidence/session-assembly/node-tests.txt
      - name: Store verified source blobs without a branch or deployment change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,os,urllib.request
          manifest=json.loads(Path('evidence/session-assembly/input-manifest.json').read_text());output=[]
          for entry in manifest:
            data=Path(entry['path']).read_bytes()
            assert hashlib.sha256(data).hexdigest()==entry['after']
            body=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
            request=urllib.request.Request('https://api.github.com/repos/hadyatallah/thesmarty-solution/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
            assert result['sha']==hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            output.append({'path':entry['path'],'sha':result['sha'],'sha256':entry['after']})
          Path('evidence/session-assembly/blob-manifest.json').write_text(json.dumps(output,indent=2)+'\n')
          print(json.dumps(output,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-assembly-evidence
          path: evidence/session-assembly/
          retention-days: 14
          if-no-files-found: error
