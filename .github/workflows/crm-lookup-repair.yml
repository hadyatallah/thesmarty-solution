name: Scoped CRM lookup repair
on:
  push:
    branches: [fix/crm-lookup-ai-availability-build]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Run checksum-verified CRM lookup repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/crm-lookup-ai-availability-build
          fetch-depth: 3
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply checksum-verified patch to the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = '45e8ba21f3efa65be77715fc8e2ee612be67eda2'
          node --test tests/assistant-formatting.test.mjs tests/command-center/*.test.js > "$RUNNER_TEMP/before.tap" 2>&1 || true
          python - <<'PY'
          import base64,gzip,hashlib,os,pathlib,subprocess
          source=subprocess.check_output(['git','show','bf6dd848a05df15d5f28c45cd70208b4346e4e86:.github/workflows/crm-lookup-repair.yml'],text=True)
          encoded=source.split("PATCH_B64: '",1)[1].split("'",1)[0]
          # Repair transport transcription only. The decoded patch must match the locally tested checksum.
          for bad,good in [('WRjFYycfw','WRjFYyfw'),('fTPRmkSU4','fTPRmk+4'),('MKS5Lkaa','MKS5Fkaa'),('zZexe9oyWQiBAh0','zZexe9oyWAh0')]:
              assert encoded.count(bad)==1,bad
              encoded=encoded.replace(bad,good)
          patch=gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='b30ce21f9382940f121e132424d607aa25958849f62edc5fd649a1868b090f93','Patch checksum mismatch'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'crm-lookup.patch';target.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(target)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(target)],check=True)
          PY
      - name: Run synthetic acceptance and regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --check crm/assistant.js
          node --test tests/command-center/lookup-availability.test.js > "$RUNNER_TEMP/lookup.tap"
          node --test tests/assistant-formatting.test.mjs tests/command-center/*.test.js > "$RUNNER_TEMP/after.tap" 2>&1 || true
          python - <<'PY'
          import pathlib,os,re,json,datetime,subprocess
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          def failures(name):return set(re.findall(r'^not ok \d+ - (.+)$',(temp/name).read_text(),re.M))
          before=failures('before.tap');after=failures('after.tap')
          assert not after-before, 'New regression failures: '+str(after-before)
          paths=['command-center/company-lookup.js','command-center/manager.js','crm/assistant.js','crm/command-center.js','crm/index.html','tests/command-center/lookup-availability.test.js']
          receipt={'baseline':'45e8ba21f3efa65be77715fc8e2ee612be67eda2','checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'scope':'CRM local lookup and observed AI availability only','targetedTests':28,'targetedFailures':0,'newRegressionFailures':sorted(after-before),'existingRegressionFailures':sorted(before),'browserTests':'Not run in CI','data':'Synthetic only; no live CRM writes or external messages','blobs':{p:subprocess.check_output(['git','hash-object',p],text=True).strip() for p in paths}}
          out=pathlib.Path('docs/command-center/lookup-repair-validation.json');out.write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
      - name: Save tested source on this isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/crm-lookup-ai-availability-build'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add command-center/company-lookup.js command-center/manager.js crm/assistant.js crm/command-center.js crm/index.html tests/command-center/lookup-availability.test.js docs/command-center/lookup-repair-validation.json
          git commit -m 'Apply tested CRM company lookup and AI availability correction'
          git push origin HEAD:fix/crm-lookup-ai-availability-build
