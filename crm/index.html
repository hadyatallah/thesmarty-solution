</style></head><body><header><div><h1>The Smarty Solution</h1><small>Connect · Develop · Invest</small></div><div><strong>Private CRM</strong><br><small id="sync">Private workspace</small><br><button id="signOutButton" hidden onclick="logout()" style="margin-top:8px">Sign out</button></div></header><nav aria-label="Main navigation" id="nav"></nav><main id="main"><div class="empty">Loading your workspace…</div></main><dialog id="dialog"></dialog><div id="notice" role="status" aria-live="polite"></div><script>
'use strict';
let sessionToken='',loginConfig=null;
const TRUSTED_SESSION_KEY='tss-crm-trusted-session-v1';
const STATE_CACHE_KEY='tss-crm-last-state-v1';
const AI_CHAT_KEY='tss-crm-ai-chat-v2';
const AI_ACTION_KEY='tss-crm-ai-actions-v2';
const AI_PENDING_KEY='tss-crm-ai-pending-v2';
const AI_UNDO_KEY='tss-crm-ai-undo-v2';
const TRUSTED_SESSION_MAX_MS=30*24*60*60*1000;
const STATE_CACHE_MAX_MS=7*24*60*60*1000;
const isInstalledApp=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
const requestedView=new URLSearchParams(location.search).get('view');
let state=null,view=['Today','Management','Prospect Queue','Companies','Contacts','Opportunities','Conversion','Clients','Tickets','Tasks','Intelligence','Outreach','Data Quality','Reports','System Health','Assistant','Access'].includes(requestedView)?requestedView:'Today',query='',filter='',page=0,board=false,busy=false,companyFilters={district:'',category:'',status:'',priority:'',researchLevel:'',lifecycle:'',communicationStatus:'',scoreBand:''},companySort='asc',aiContextSelection={entity:'',id:'',label:''},aiConversation=[],aiPendingPlan=null;
const labels={name:'Name',companyId:'Company',contactEmail:'Contact email',nextAction:'Next action',followUp:'Follow-up date',dueDate:'Due date',researchLevel:'Research level',source1:'Research source',source2:'Additional source',projectValue:'Project value',tssFee:'Potential TSS fee',opportunityId:'Opportunity',ticketId:'Ticket',threadId:'Email thread',createdAt:'Created',updatedAt:'Updated',lifecycle:'Lifecycle',lastContact:'Last contact',communicationStatus:'Communication status',decisionMaker:'Decision maker',primaryContact:'Primary contact',lastInteraction:'Last interaction',linkedin:'LinkedIn',leadScore:'Lead score',scoreBand:'Score band',scoreReason:'Score reason',scoreUpdatedAt:'Score updated',qualificationStatus:'Qualification status',decisionMakerConfirmed:'Decision maker confirmed',budgetStatus:'Budget status',commercialPotential:'Commercial potential',tssFit:'TSS fit',decisionCriteria:'Decision criteria',targetCloseDate:'Target date',lossReason:'Loss reason',engagementStatus:'Engagement status',startDate:'Start date',deliveryScope:'Delivery scope',deliveryRisk:'Delivery risk',clientDecisions:'Client decisions needed',reviewDate:'Review date',commercialModel:'Commercial model',agreedFee:'Agreed TSS fee',clientHealth:'Client health',renewalDate:'Renewal date',expansionOpportunity:'Expansion opportunity',postSaleNextAction:'Post-sale next action'};
const titles={Companies:'Companies',Contacts:'People',Opportunities:'Opportunities',Tickets:'Requests & Tickets',Tasks:'Follow-ups'};
const CRM_GUIDE_SUMMARY='TSS CRM rules: Company = database/research record. Prospect = actively selected. Qualified Lead requires real commercial need or agreed next step; a positive reply alone is not qualification. Opportunity stages: Identified, Qualified, Discovery, Proposal, Negotiation, Won, Lost, On hold. Won requires post-sale handoff and does not automatically create an invoice or change lifecycle to Client. Do not contact blocks outreach. Proposal requires an opportunity. Revenue Tracker is operational CRM tracking only, not accounting/tax truth. Duplicate confirmation never auto-merges/deletes. Normal writes require confirmation. Sensitive actions require explicit confirmation: qualification, Won/Lost, Do not contact, payment/revenue status, outreach sending/approval, merge/delete. Never invent contact details, budget, fees, dates, project values, payment status or decision-makers.';
const el=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=k=>labels[k]||(k.charAt(0).toUpperCase()+k.slice(1)).replace(/([a-z])([A-Z])/g,'$1 $2');
const today=()=>{const d=new Date();return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Nicosia',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)};
const GOOGLE_CLIENT_ID='103840050410-80lukup1okjnkmt6qvmd9s2mbvi3uakf.apps.googleusercontent.com';
const CRM_API='https://script.google.com/macros/s/AKfycbyiSUdWOD3LfVzzvV_8WnO3gGvKLbvbNcyTYKnFpUU-Duh8u8liGfU79cc3erXTG9Hk4Q/exec';
let sessionExpiry=0,loginGeneration=0;
async function rpc(fn,...args){
 let r;try{r=await fetch(CRM_API,{method:'POST',credentials:'omit',redirect:'follow',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({fn,args})});}catch(e){throw Error('Could not connect to the CRM. Check your internet connection and retry.');}
 if(!r.ok)throw Error('CRM temporarily unavailable. Please retry.');
 let data;try{data=await r.json()}catch(e){throw Error('Unexpected CRM response. Please retry.');}
 if(!data.ok)throw Error(data.error||'Request failed');return data.result;
}
async function call(fn,...args){const requestedSession=sessionToken;try{const r=await rpc(fn,requestedSession,...args);if(sessionToken!==requestedSession)throw Error('SESSION_CHANGED');return r}catch(e){if(String(e.message).includes('AUTH_REQUIRED')&&sessionToken===requestedSession){clearSession();showLogin('Your session ended. Please sign in again.');}throw e}}
function clearSession(removeTrusted=true){sessionToken='';sessionExpiry=0;state=null;loginGeneration++;if(removeTrusted){try{localStorage.removeItem(TRUSTED_SESSION_KEY)}catch(e){}}el('dialog').close();el('dialog').innerHTML='';el('nav').innerHTML='';el('main').innerHTML='';el('notice').textContent='';el('signOutButton').hidden=true;el('sync').textContent='Private workspace';}
function rememberTrustedSession(){if(!isInstalledApp()||!sessionToken)return;try{localStorage.setItem(TRUSTED_SESSION_KEY,JSON.stringify({token:sessionToken,serverExpiry:sessionExpiry,deviceExpiry:Date.now()+TRUSTED_SESSION_MAX_MS}))}catch(e){}}
function cacheState(){if(!state)return;try{localStorage.setItem(STATE_CACHE_KEY,JSON.stringify({savedAt:Date.now(),state}))}catch(e){}}
function loadCachedState(){let saved;try{saved=JSON.parse(localStorage.getItem(STATE_CACHE_KEY)||'null')}catch(e){}if(!saved?.state||!saved.savedAt||Date.now()-saved.savedAt>STATE_CACHE_MAX_MS)return null;return saved}
function showCachedState(reason=''){const saved=loadCachedState();if(!saved)return false;state=saved.state;el('signOutButton').hidden=false;el('sync').textContent='Last synced '+new Date(saved.savedAt).toLocaleString();render();notice('CRM server unavailable. Showing your last synced workspace.'+(reason?' '+reason:''));return true}
async function restoreTrustedSession(){if(!isInstalledApp())return false;let saved;try{saved=JSON.parse(localStorage.getItem(TRUSTED_SESSION_KEY)||'null')}catch(e){}if(!saved?.token||!saved.deviceExpiry||Date.now()>=saved.deviceExpiry){clearSession(true);return false}sessionToken=saved.token;sessionExpiry=Number(saved.serverExpiry||0);try{await rpc('checkSession',sessionToken);await refresh();return true}catch(e){const msg=String(e.message||e);if(/AUTH_REQUIRED|SESSION_CHANGED/.test(msg)){clearSession(true);return false}if(showCachedState())return true;return false}}
async function showLogin(message=''){
 const generation=++loginGeneration;
 el('main').innerHTML='<section class="panel" style="max-width:490px;margin:35px auto"><h2>Admin login</h2><p class="muted">Sign in with your authorised TSS Google account.</p><p id="loginError" class="error" role="alert">'+esc(message)+'</p><div id="googleButton">Connecting to Google…</div><p class="muted" style="font-size:13px;margin-top:20px">Google handles your password. CRM access ends when you leave or reload this page, or after one hour.</p><a href="/">Back to the TSS website</a><p><button onclick="showLogin()">Retry login</button></p></section>';
 try{
  const challenge=await rpc('beginGoogleLogin');
  if(!window.google?.accounts?.id)await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=resolve;s.onerror=()=>reject(Error('Google sign-in could not load. Please retry.'));document.head.appendChild(s)});
  if(generation!==loginGeneration)return;
  google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,nonce:challenge.nonce,auto_select:false,callback:async response=>{
   if(generation!==loginGeneration)return;
   el('googleButton').textContent='Verifying your account…';
   try{const r=await rpc('googleSignIn',response.credential,challenge.nonce);if(generation!==loginGeneration){await rpc('signOut',r.token);return}sessionToken=r.token;sessionExpiry=r.expiresAt;rememberTrustedSession();await refresh();}catch(e){if(generation===loginGeneration)showLogin(e.message)}
  }});
  el('googleButton').textContent='';google.accounts.id.renderButton(el('googleButton'),{theme:'outline',size:'large',text:'signin_with',width:280});
 }catch(e){if(generation===loginGeneration&&el('loginError')){el('googleButton').textContent='';el('loginError').textContent=e.message}}
}
async function logout(all=false){const token=sessionToken;clearSession(true);window.google?.accounts?.id?.disableAutoSelect();showLogin('Signed out.');try{await rpc(all?'signOutAll':'signOut',token)}catch(e){notice('Local sign-out complete. The server session will expire automatically.')}}
async function startLogin(){try{localStorage.removeItem('tss-crm-session-v1');sessionStorage.removeItem('tss-crm-session-v1')}catch(e){}if(await restoreTrustedSession())return;showLogin();}
window.addEventListener('pagehide',()=>{if(isInstalledApp()){rememberTrustedSession();return}const token=sessionToken;clearSession(false);if(token)fetch(CRM_API,{method:'POST',credentials:'omit',keepalive:true,headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({fn:'signOut',args:[token]})}).catch(()=>{})});
window.addEventListener('pageshow',e=>{if(e.persisted){if(isInstalledApp())startLogin();else showLogin()}});
setInterval(()=>{if(sessionToken&&sessionExpiry&&Date.now()>=sessionExpiry){if(isInstalledApp()){rpc('checkSession',sessionToken).then(()=>{rememberTrustedSession()}).catch(()=>{clearSession(true);showLogin('Your session ended. Please sign in again.')})}else{clearSession(true);showLogin('Your session ended. Please sign in again.')}}},15000);
function notice(s){el('notice').textContent=s;setTimeout(()=>{if(el('notice').textContent===s)el('notice').textContent=''},6500)}
function company(id){return state.records.Companies.find(r=>r.id===id)?.name||''}
function done(r){return ['Done','Cancelled','Closed','Resolved','Won','Lost','Do not contact','Not suitable'].includes(r.status||r.stage)}
function overdue(r){return !done(r)&&(r.dueDate||r.followUp)&&(r.dueDate||r.followUp)<today()}
function dateOffset(days){const d=new Date();d.setDate(d.getDate()+days);return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Nicosia',year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function dueToday(r){return !done(r)&&(r.dueDate||r.followUp)==today()}
function dueSoon(r){const d=r.dueDate||r.followUp;return !done(r)&&d>dTodaySafe()&&d<=dateOffset(3)}
function dTodaySafe(){return today()}
function actionableRecords(){const r=state.records;return [...r.Tasks.map(x=>['Tasks',x]),...r.Tickets.map(x=>['Tickets',x]),...r.Companies.map(x=>['Companies',x]),...r.Opportunities.map(x=>['Opportunities',x])].filter(x=>!done(x[1])&&(x[1].dueDate||x[1].followUp))}
function updateAppBadge(){if(!('setAppBadge' in navigator)||!state)return;const count=actionableRecords().filter(x=>overdue(x[1])||dueToday(x[1])).length;try{count?navigator.setAppBadge(count):navigator.clearAppBadge?.()}catch(e){}}
function ageDays(value){if(!value)return null;const d=new Date(value);if(Number.isNaN(d.getTime()))return null;return Math.floor((Date.now()-d.getTime())/86400000)}
function inactiveRecord(entity,r){if(done(r))return false;if(entity==='Companies'){if(!['Prospect','Qualified Lead','Opportunity'].includes(r.lifecycle))return false;const age=ageDays(r.lastContact||r.updatedAt||r.createdAt);return age!==null&&age>=14}if(entity==='Opportunities'){const age=ageDays(r.updatedAt||r.createdAt);return age!==null&&age>=10}return false}
function inactivityLabel(entity,r){const age=ageDays(entity==='Companies'?(r.lastContact||r.updatedAt||r.createdAt):(r.updatedAt||r.createdAt));return age===null?'Inactive':(entity==='Companies'?'No contact ':'No activity ')+age+' days'}
function dataIssueView(message){
 el('signOutButton').hidden=false;
 el('sync').textContent='Signed in · data issue';
 el('nav').innerHTML='';
 el('main').innerHTML='<section class="panel" style="max-width:760px;margin:35px auto"><h2>CRM data check needs attention</h2><p>You are signed in. A data-quality issue is preventing the CRM records from loading, but your account access is still active.</p><p class="error">'+esc(message)+'</p><div class="toolbar"><button class="primary" onclick="refresh()">Retry data load</button><button onclick="logout()">Sign out</button></div><p class="muted" style="font-size:13px">The CRM will not treat a record-validation problem as a login failure. Fix the affected data, then retry.</p></section>';
}
function validateLoadedState(){
 const problems=[];
 for(const [entity,records] of Object.entries(state?.records||{})){
  if(!Array.isArray(records))continue;
  const seen=new Set();
  for(const r of records){
   if(!r?.id)continue;
   if(seen.has(r.id))problems.push('Duplicate ID in '+entity+': '+r.id);
   else seen.add(r.id);
  }
 }
 return problems;
}
async function refresh(){try{state=await call('getState');const integrity=validateLoadedState();if(integrity.length){dataIssueView(integrity.join(' | '));return;}if(state?.records?.Companies){state.records.Companies.forEach(r=>{if(classificationOverlay[r.id])r.classification=classificationOverlay[r.id]});}cacheState();el('signOutButton').hidden=false;el('sync').textContent='Synced '+new Date(state.updatedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});render();updateAppBadge()}catch(e){if(/AUTH_REQUIRED|SESSION_CHANGED/.test(String(e.message)))return;const msg=String(e.message||e);if(sessionToken&&/Duplicate ID|data|validation|record/i.test(msg)){dataIssueView(msg);return;}if(sessionToken&&showCachedState())return;if(!state)el('main').innerHTML='<div class="empty error">'+esc(msg)+'<br><button onclick="refresh()">Retry</button></div>';else notice(msg)}}
function go(v){view=v;query='';filter='';page=0;companyFilters={district:'',category:'',status:'',priority:'',researchLevel:'',classification:'',lifecycle:'',communicationStatus:'',scoreBand:''};companySort='asc';render()}
function openCrmMenu(){const groups=[['Work',['Today','Management','Assistant']],['Commercial',['Prospect Queue','Companies','Contacts','Opportunities','Conversion','Outreach']],['Operations',['Clients','Tickets','Tasks','Intelligence']],['Admin',['Data Quality','Reports','System Health','Access']]];showDialog('CRM Menu','<div class="menu-grid">'+groups.map(([g,items])=>'<section class="menu-group"><h3>'+esc(g)+'</h3>'+items.map(v=>'<button onclick="el(\'dialog\').close();go(\''+v+'\')">'+esc(titles[v]||v)+'</button>').join('')+'</section>').join('')+'</div>')}

function normEmail(v){return String(v||'').trim().toLowerCase()}
function normPhone(v){return String(v||'').replace(/\D/g,'')}
const PUBLIC_EMAIL_DOMAINS=new Set(['gmail.com','hotmail.com','outlook.com','yahoo.com','yahoo.gr','icloud.com','live.com','windowslive.com','cytanet.com.cy','cablenet.com.cy']);
function normalizeCompanyName(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/&/g,' and ').replace(/\b(ltd|limited|llc|plc|co|company|companies|cyprus)\b/g,' ').replace(/[^\p{L}\p{N}]+/gu,' ').replace(/\s+/g,' ').trim()}
function webDomain(v){let s=String(v||'').trim().toLowerCase();if(!s)return'';try{if(!/^https?:\/\//.test(s))s='https://'+s;return new URL(s).hostname.replace(/^www\./,'')}catch(e){return''}}
function businessEmailDomain(v){const e=normEmail(v);if(!e.includes('@'))return'';const d=e.split('@').pop();return PUBLIC_EMAIL_DOMAINS.has(d)?'':d}
function companyDomain(r){return webDomain(r.website)||businessEmailDomain(r.email)}
function nameSimilarity(a,b){const A=new Set(normalizeCompanyName(a).split(' ').filter(Boolean)),B=new Set(normalizeCompanyName(b).split(' ').filter(Boolean));if(!A.size||!B.size)return 0;const inter=[...A].filter(x=>B.has(x)).length;return inter/new Set([...A,...B]).size}
function dqSignature(ids){const s=[...ids].sort().join('|');let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return 'DQ-'+(h>>>0).toString(36).toUpperCase()}
function dqMarker(kind,signature){return '[DQ_'+kind+':'+signature+']'}
function hasDqMarker(r,kind,signature){return String(r.verificationNotes||'').includes(dqMarker(kind,signature))}
function duplicatePairCandidates(){
 const companies=state.records.Companies||[],pairs=[];
 for(let i=0;i<companies.length;i++)for(let j=i+1;j<companies.length;j++){
  const a=companies[i],b=companies[j],exactName=normalizeCompanyName(a.name)&&normalizeCompanyName(a.name)===normalizeCompanyName(b.name),sim=nameSimilarity(a.name,b.name);
  const ae=normEmail(a.email),be=normEmail(b.email),sameEmail=!!ae&&ae===be;
  const ap=normPhone(a.phone),bp=normPhone(b.phone),samePhone=ap.length>=7&&ap===bp;
  const ad=companyDomain(a),bd=companyDomain(b),sameDomain=!!ad&&ad===bd;
  const signals=[];if(exactName)signals.push('name');if(sameEmail)signals.push('email');if(samePhone)signals.push('phone');if(sameDomain)signals.push('domain');
  let confidence='';
  if(exactName&&(sameEmail||samePhone||sameDomain))confidence='high';
  else if((sameEmail||sameDomain||samePhone)&&sim>=.55)confidence='high';
  else if(exactName)confidence='medium';
  else if((sameEmail||sameDomain||samePhone)&&sim>=.30)confidence='medium';
  if(!confidence)continue;
  const signature=dqSignature([a.id,b.id]);
  if(hasDqMarker(a,'KEEP',signature)&&hasDqMarker(b,'KEEP',signature))continue;
  const confirmed=hasDqMarker(a,'DUP',signature)&&hasDqMarker(b,'DUP',signature);
  pairs.push({a,b,signals,similarity:sim,confidence,signature,confirmed});
 }
 return pairs.sort((x,y)=>(x.confirmed?1:0)-(y.confirmed?1:0)||(x.confidence==='high'?-1:1)-(y.confidence==='high'?-1:1)||Number(y.similarity)-Number(x.similarity));
}
function dataQualityIssues(){
 const companies=state.records.Companies||[],contacts=state.records.Contacts||[],tickets=state.records.Tickets||[],pairs=duplicatePairCandidates();
 const high=pairs.filter(x=>x.confidence==='high'&&!x.confirmed),medium=pairs.filter(x=>x.confidence==='medium'&&!x.confirmed),confirmed=pairs.filter(x=>x.confirmed);
 const active=companies.filter(r=>['Prospect','Qualified Lead','Opportunity'].includes(r.lifecycle));
 const incomplete=active.filter(r=>(!r.email&&!r.phone)||!r.nextAction||!r.followUp||!r.communicationStatus);
 const contactGaps=contacts.filter(r=>r.companyId&&((!r.email&&!r.phone)||!r.role));
 const companyByEmail=new Map(),companyByDomain=new Map();
 companies.forEach(r=>{const e=normEmail(r.email),d=companyDomain(r);if(e){if(!companyByEmail.has(e))companyByEmail.set(e,[]);companyByEmail.get(e).push(r)}if(d){if(!companyByDomain.has(d))companyByDomain.set(d,[]);companyByDomain.get(d).push(r)}});
 const emailMatches=[];
 tickets.filter(t=>!t.companyId&&t.contactEmail).forEach(t=>{const e=normEmail(t.contactEmail),d=businessEmailDomain(e),exact=companyByEmail.get(e)||[],domain=d?(companyByDomain.get(d)||[]):[],matches=exact.length?exact:domain;if(matches.length===1)emailMatches.push({ticket:t,company:matches[0],basis:exact.length?'exact email':'unique business domain'})});
 return{high,medium,confirmed,incomplete,contactGaps,emailMatches};
}

}
async function markDuplicateDecision(aid,bid,kind){
 if(busy)return;const a=state.records.Companies.find(r=>r.id===aid),b=state.records.Companies.find(r=>r.id===bid);if(!a||!b)return;
 const signature=dqSignature([aid,bid]),marker=dqMarker(kind,signature);

 try{
  for(const r of [a,b]){
   if(String(r.verificationNotes||'').includes(marker))continue;
   const data={...r,verificationNotes:(String(r.verificationNotes||'').trim()+'\n'+marker+' '+(kind==='KEEP'?'Reviewed as separate companies.':'Confirmed duplicate pair. No automatic merge performed.')).trim(),id:r.id,version:r.version};
   const saved=await call('saveRecord','Companies',data);Object.assign(r,data);if(saved&&typeof saved==='object')Object.assign(r,saved);
  }
  el('dialog').open&&el('dialog').close();cacheState();notice(kind==='KEEP'?'Marked as separate. This pair will not be flagged again.':'Duplicate confirmed. Pair moved out of the unresolved queue.');dataQuality();await refresh();
 }catch(e){notice(e.message)}finally{busy=false}
}
function dataQuality(){
 const q=dataQualityIssues(),mainCount=q.high.length,secondary=q.medium.length,total=mainCount+q.incomplete.length+q.contactGaps.length+q.emailMatches.length;
 el('main').innerHTML='<h2>Data Quality</h2><p class="muted">High-confidence issues are prioritized. Shared public email providers and weak domain-only matches are excluded from the main queue. Nothing is auto-merged or deleted.</p><div class="cards"><div class="panel metric"><span>High-confidence duplicates</span><strong>'+mainCount+'</strong></div><div class="panel metric"><span>Possible matches</span><strong>'+secondary+'</strong><small class="muted">Secondary review only</small></div><div class="panel metric"><span>Active records incomplete</span><strong>'+q.incomplete.length+'</strong></div><div class="panel metric"><span>Email match suggestions</span><strong>'+q.emailMatches.length+'</strong></div></div><section class="panel"><h3>Action queue <span class="badge '+(total?'warning':'')+'">'+total+'</span></h3><section class="section"><h3>High-confidence duplicate pairs <span class="badge warning">'+mainCount+'</span></h3><p class="muted">Requires a strong combination of matching company identity and contact/domain evidence.</p><div class="list">'+(q.high.map(duplicatePairCard).join('')||'<p class="muted">No unresolved high-confidence duplicate pairs.</p>')+'</div></section><details class="section"><summary><strong>Possible matches ('+secondary+')</strong> <span class="muted">Exact normalized name or weaker matching evidence. Review only when useful.</span></summary><div class="list" style="margin-top:12px">'+(q.medium.slice(0,60).map(duplicatePairCard).join('')||'<p class="muted">None.</p>')+'</div></details>'+(q.confirmed.length?'<details class="section"><summary><strong>Confirmed duplicate pairs ('+q.confirmed.length+')</strong></summary><div class="list" style="margin-top:12px">'+q.confirmed.map(duplicatePairCard).join('')+'</div></details>':'')+'<section class="section"><h3>Active records missing key data <span class="badge warning">'+q.incomplete.length+'</span></h3><div class="list">'+(q.incomplete.slice(0,30).map(r=>'<button class="record" onclick="detail(\'Companies\',\''+esc(r.id)+'\')"><strong>'+esc(r.name)+'</strong><span class="muted">'+[!r.email&&!r.phone?'No contact details':'',!r.nextAction?'No next action':'',!r.followUp?'No follow-up date':'',!r.communicationStatus?'No communication status':''].filter(Boolean).join(' · ')+'</span></button>').join('')||'<p class="muted">No active-record gaps.</p>')+'</div></section><section class="section"><h3>Contact records missing essentials <span class="badge">'+q.contactGaps.length+'</span></h3><div class="list">'+(q.contactGaps.slice(0,30).map(r=>card('Contacts',r)).join('')||'<p class="muted">No contact gaps.</p>')+'</div></section><section class="section"><h3>Email-to-company suggestions <span class="badge">'+q.emailMatches.length+'</span></h3><p class="muted">Only exact-email or unique business-domain matches are shown. Public mailbox domains are ignored.</p><div class="list">'+(q.emailMatches.slice(0,30).map(x=>'<div class="record"><strong>'+esc(x.ticket.name)+'</strong><span>'+esc(x.ticket.contactEmail)+' → '+esc(x.company.name)+'</span><small class="muted">'+esc(x.basis)+'</small></div>').join('')||'<p class="muted">No unmatched email tickets with a unique company suggestion.</p>')+'</div></section></section><div class="toolbar"><button onclick="refresh()">Refresh checks</button></div>';
}

function reports(){const r=state.records,counts=(type,k)=>{const c={};(r[type]||[]).forEach(x=>c[x[k]||'Unspecified']=(c[x[k]||'Unspecified']||0)+1);return Object.entries(c).map(([n,v])=>'<div class="row"><span>'+esc(n)+'</span><strong>'+v+'</strong></div>').join('')||'<p class="muted">No records yet.</p>'};const fee={};(r.Opportunities||[]).filter(x=>x.stage==='Won').forEach(x=>{fee[x.currency]=(fee[x.currency]||0)+Number(x.tssFee||0)});const lifecycle={};(r.Companies||[]).forEach(x=>lifecycle[x.lifecycle||'Company']=(lifecycle[x.lifecycle||'Company']||0)+1);const openOpp=(r.Opportunities||[]).filter(x=>!done(x)).length,overdueTasks=(r.Tasks||[]).filter(overdue).length,inactive=[...(r.Companies||[]).map(x=>['Companies',x]),...(r.Opportunities||[]).map(x=>['Opportunities',x])].filter(x=>inactiveRecord(x[0],x[1])).length,dq=dataQualityIssues();el('main').innerHTML='<h2>Reports</h2><p class="muted">Commercial and operating view of the current CRM.</p><div class="cards">'+[['Prospects',lifecycle.Prospect||0],['Qualified leads',lifecycle["Qualified Lead"]||0],['Open opportunities',openOpp],['Overdue follow-ups',overdueTasks]].map(([n,v])=>'<div class="panel metric"><span>'+n+'</span><strong>'+v+'</strong></div>').join('')+'</div><div class="grid"><section class="panel"><h3>Commercial lifecycle</h3>'+Object.entries(lifecycle).map(([n,v])=>'<div class="row"><span>'+esc(n)+'</span><strong>'+v+'</strong></div>').join('')+'</section><section class="panel"><h3>Opportunity stages</h3>'+counts('Opportunities','stage')+'</section><section class="panel"><h3>Operating risk</h3><div class="row"><span>Inactive active records</span><strong>'+inactive+'</strong></div><div class="row"><span>Data-quality review items</span><strong>'+(dq.high.length+dq.incomplete.length+dq.contactGaps.length+dq.emailMatches.length)+'</strong></div><div class="row"><span>Open tickets</span><strong>'+(r.Tickets||[]).filter(x=>!done(x)).length+'</strong></div></section><section class="panel"><h3>TSS fees on won opportunities</h3>'+(Object.entries(fee).map(([cur,v])=>'<p><strong>'+esc(cur)+' '+v.toLocaleString()+'</strong></p>').join('')||'<p class="muted">No won fees recorded.</p>')+'<small class="muted">Recorded opportunity fees only. Not confirmed invoices or payments.</small></section></div><div class="toolbar"><button onclick="go(\'Outreach\')">Outreach</button><button onclick="go(\'Data Quality\')">Data Quality</button><button onclick="go(\'System Health\')">System Health</button></div>'}

function systemHealth(){const integrity=validateLoadedState(),cached=loadCachedState(),sheet='https://docs.google.com/spreadsheets/d/1mZ7vd2UoGXlyxzwZ8Man593UhlLGt2uS1kIS3ZAWPsU/edit',control=sheet+'#gid=945494362',log=sheet+'#gid=731237999',backup='https://docs.google.com/spreadsheets/d/1PbGS75U2i_QDD-qyw5cm3N4BpMY1tWgk8p90RbSo0mc/edit';const dataOk=!integrity.length,app=isInstalledApp();el('main').innerHTML='<h2>System Health</h2><p class="muted">Current CRM health and control points. Runtime automation status is logged in the master workbook.</p><div class="cards"><div class="panel metric"><span>CRM data</span><strong style="font-size:22px">'+(dataOk?'Healthy':'Check')+'</strong><small class="muted">'+(dataOk?'No duplicate IDs detected':esc(integrity[0]))+'</small></div><div class="panel metric"><span>Last CRM sync</span><strong style="font-size:22px">'+esc(state?.updatedAt?new Date(state.updatedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'Unknown')+'</strong><small class="muted">Live API state</small></div><div class="panel metric"><span>Phone app</span><strong style="font-size:22px">'+(app?'Installed':'Browser')+'</strong><small class="muted">'+(app?'Trusted-device session enabled':'Temporary browser session')+'</small></div><div class="panel metric"><span>Backup</span><strong style="font-size:22px">Enabled</strong><small class="muted">Daily control + manual retention</small></div></div><div class="grid"><section class="panel"><h3>Automation controls</h3><p><strong>Outreach:</strong> controlled by System Control. Approved + Ready to send remains mandatory while approvalRequired=YES.</p><p><strong>Reply monitoring:</strong> controlled separately.</p><p><strong>Follow-up monitoring:</strong> uses the inactivity thresholds from System Control.</p><p><strong>Backup:</strong> daily, duplicate-date protected, no automatic deletion.</p><div class="toolbar"><a href="'+control+'" target="_blank" rel="noopener">Open System Control</a><a href="'+log+'" target="_blank" rel="noopener">Open Automation Log</a></div></section><section class="panel"><h3>Recovery</h3><p>A full workbook backup was created when Phase 5 was activated. Daily backups are configured while backupEnabled=ON.</p><p class="muted">Business records are preserved. The CRM interface does not expose destructive delete actions.</p><div class="toolbar"><a href="'+backup+'" target="_blank" rel="noopener">Open latest baseline backup</a><a href="'+sheet+'" target="_blank" rel="noopener">Open master workbook</a></div></section></div><section class="panel section"><h3>Local resilience</h3><div class="row"><span>Cached CRM snapshot available</span><strong>'+(cached?'Yes':'No')+'</strong></div><div class="row"><span>Installed-app session persistence</span><strong>'+(app?'Active':'Not applicable')+'</strong></div><div class="row"><span>Data integrity check</span><strong>'+(dataOk?'Pass':'Attention')+'</strong></div></section>'}

function assistantContextSearch(value){const box=el('aiContextResults');if(!box)return;aiContextSelection={entity:'',id:'',label:''};const q=String(value||'').trim().toLowerCase();if(q.length<2){box.innerHTML='<p class="muted" style="margin:8px 0 0">Type at least 2 characters to search companies, opportunities, tickets or follow-ups. Leave blank for the working-day snapshot.</p>';return}const groups=['Companies','Opportunities','Tickets','Tasks'];const matches=[];for(const t of groups){for(const r of state.records[t]||[]){const companyName=r.companyId?company(r.companyId):'';const hay=[r.name,r.id,companyName,r.status,r.stage,r.category,r.district].filter(Boolean).join(' ').toLowerCase();if(hay.includes(q))matches.push({t,r,companyName});if(matches.length>=8)break}if(matches.length>=8)break}box.innerHTML=matches.length?'<div class="list" style="margin-top:10px">'+matches.map(x=>'<button type="button" class="record" onclick="chooseAssistantContext(\''+x.t+'\',\''+esc(x.r.id)+'\',\''+esc((x.r.name||x.r.id).replace(/'/g,"&#39;"))+'\')"><strong>'+esc(x.r.name||x.r.id)+'</strong><span class="muted">'+esc(titles[x.t]||x.t)+(x.companyName?' · '+esc(x.companyName):'')+'</span></button>').join('')+'</div>':'<p class="muted" style="margin:8px 0 0">No matching CRM records.</p>'}
function chooseAssistantContext(entity,id,labelText){aiContextSelection={entity,id,label:labelText};el('aiContextSearch').value=labelText;el('aiContextResults').innerHTML='<p class="muted" style="margin:8px 0 0">Selected: '+esc(labelText)+' · <button type="button" onclick="clearAssistantContext()" style="min-height:auto;padding:2px 7px">Clear</button></p>'}
function clearAssistantContext(){aiContextSelection={entity:'',id:'',label:''};if(el('aiContextSearch'))el('aiContextSearch').value='';if(el('aiContextResults'))el('aiContextResults').innerHTML='<p class="muted" style="margin:8px 0 0">Working-day snapshot selected.</p>'}
function localAssistantAnswer(question){const q=String(question||'').toLowerCase(),d=dataQualityIssues();if(q.includes('duplicate')){return 'Data quality check:\n• Possible duplicate names: '+d.dupNames.length+'\n• Shared domains: '+d.dupDomains.length+'\n• Shared emails: '+d.dupEmails.length+'\n• Shared phone numbers: '+d.dupPhones.length+'\n\nOpen Data Quality to review the affected records.'}if((q.includes('missing')&&(q.includes('email')||q.includes('contact')||q.includes('follow-up')||q.includes('follow up')||q.includes('next action')))||q.includes('data quality')){return 'Current data-quality queue:\n• Active companies missing key action/contact data: '+d.incomplete.length+'\n• Contact records missing essentials: '+d.contactGaps.length+'\n• Email-to-company match suggestions: '+d.emailMatches.length+'\n\nOpen Data Quality for the record-level review.'}if(q.includes('email')&&(q.includes('match')||q.includes('unmatched')||q.includes('link'))){return 'There are '+d.emailMatches.length+' unmatched email ticket(s) with a unique company suggestion. Open Data Quality → Email-to-company suggestions to review them.'}return''}
function assistant(){aiContextSelection={entity:'',id:'',label:''};el('main').innerHTML='<h2>Assistant</h2><p class="muted">Ask about your working day or search for a specific CRM record.</p><section class="panel"><h3>AI assistant</h3><p>'+ (state.aiEnabled?'Connected. Selected record content and your question are sent to Groq to generate the answer.':'The AI connection is not active yet. Your CRM works independently.')+'</p><form id="aiForm"><label><span>Context</span><input id="aiContextSearch" type="search" autocomplete="off" placeholder="Search a company or record, or leave blank for today…" oninput="assistantContextSearch(this.value)"></label><div id="aiContextResults"><p class="muted" style="margin:8px 0 0">Working-day snapshot selected.</p></div><label style="margin-top:16px"><span>Your question</span><textarea id="aiQuestion" maxlength="3000" placeholder="What needs my attention today?" required></textarea></label><div class="actions"><button type="submit" class="primary" '+(!state.aiEnabled?'disabled':'')+'>Ask assistant</button></div></form><div id="aiAnswer" style="white-space:pre-wrap" role="status"></div></section><section class="panel section"><h3>Email capture</h3><p>'+ (state.emailEnabled?'Connected to thesmartysolution@gmail.com. Relevant incoming emails are checked every 15 minutes. No emails are sent automatically.':'Gmail capture is awaiting connection. You can create tickets manually.')+'</p>'+(state.emailError?'<p class="error">'+esc(state.emailError)+'</p>':'')+(state.emailEnabled?'<button onclick="syncInbox()">Check inbox now</button>':'')+'<p class="muted">The info@thesmartysolution.com mailbox is not connected yet.</p></section>';el('aiForm').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;el('aiAnswer').textContent='Preparing an answer…';try{const question=el('aiQuestion').value,local=localAssistantAnswer(question);if(local){el('aiAnswer').textContent=local;return}const result=await call('askAssistant',question,aiContextSelection.entity||'',aiContextSelection.id||'');if(el('aiAnswer'))el('aiAnswer').textContent=result.answer}catch(err){if(el('aiAnswer'))el('aiAnswer').textContent=err.message}finally{button.disabled=false}}}
