name: Temp contractors extract
on:
  push:
    branches: [chatgpt-contractors-temp]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Limassol contractor PDF
        run: |
          set -e
          python -m pip install --quiet pdfplumber requests
          python - <<'PY'
          import requests, pdfplumber, re, json
          url='https://www.contractorscouncil.org.cy/wp-content/uploads/2026/09/%CE%9A%CE%B1%CF%84%CE%AC%CE%BB%CE%BF%CE%B3%CE%BF%CF%82-%CE%9B%CE%B5%CE%BC%CE%B5%CF%83%CE%BF%CF%8D-%CE%9F%CE%B9%CE%BA%CE%BF%CE%B4%CE%BF%CE%BC%CE%B9%CE%BA%CE%AC.pdf'
          b=requests.get(url,timeout=60).content
          open('/tmp/limassol.pdf','wb').write(b)
          pages=[]
          tables=[]
          with pdfplumber.open('/tmp/limassol.pdf') as pdf:
              for i,p in enumerate(pdf.pages):
                  pages.append({'page':i+1,'text':p.extract_text(x_tolerance=1,y_tolerance=3) or ''})
                  ts=p.extract_tables() or []
                  tables.append({'page':i+1,'tables':ts})
          open('tmp_contractors_raw.json','w',encoding='utf-8').write(json.dumps(pages,ensure_ascii=False))
          open('tmp_contractors_tables.json','w',encoding='utf-8').write(json.dumps(tables,ensure_ascii=False))
          print('pages',len(pages),'tables',sum(len(x['tables']) for x in tables))
          PY
      - name: Commit extraction
        run: |
          git config user.name "ChatGPT Temp"
          git config user.email "actions@users.noreply.github.com"
          git add tmp_contractors_raw.json tmp_contractors_tables.json
          git commit -m "temp: extract contractor pdf" || exit 0
          git push
