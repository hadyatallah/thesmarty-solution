name: Build TSS Greece review asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-tss-greece-review.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Render approved-style Greece feed
        run: |
          set -euo pipefail
          mkdir -p social/review-assets
          curl --fail --location --silent --show-error             'https://upload.wikimedia.org/wikipedia/commons/2/25/Acropolis_Parthenon_Athens_Greece.jpg'             -o /tmp/athens.jpg
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import sharp from 'sharp';

          const W=1080,H=1350;
          const cream='#F7F3EA', navy='#082746', teal='#1596A6', slate='#435E73', white='#FFFFFF';

          const photo = await sharp('/tmp/athens.jpg')
            .resize(W, 570, {fit:'cover', position:'centre'})
            .modulate({brightness:0.96,saturation:0.92})
            .jpeg({quality:94})
            .toBuffer();

          const logoRaw = await fs.readFile('logo-mark.png');
          const logo = await sharp(logoRaw).trim().resize({width:175}).png().toBuffer();

          const svg = Buffer.from(`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
          <rect width="1080" height="1350" fill="${cream}"/>
          <style>
            .sans { font-family: "DejaVu Sans", Arial, sans-serif; }
            .navy { fill:${navy}; }
            .teal { fill:${teal}; }
            .slate { fill:${slate}; }
            .white { fill:${white}; }
          </style>

          <text x="68" y="72" class="sans slate" font-size="19" font-weight="700" letter-spacing="7">GREECE ECONOMY</text>

          <text x="68" y="210" class="sans navy" font-size="72" font-weight="800">GREECE</text>
          <text x="68" y="288" class="sans teal" font-size="72" font-weight="800">IS GROWING.</text>

          <text x="68" y="354" class="sans navy" font-size="31" font-weight="500" letter-spacing="4">BUT WHAT IS DRIVING</text>
          <text x="68" y="396" class="sans navy" font-size="31" font-weight="500" letter-spacing="4">THE MOMENTUM?</text>

          <text x="68" y="550" class="sans teal" font-size="126" font-weight="800">+1.9%</text>
          <text x="72" y="600" class="sans navy" font-size="25" font-weight="800">REAL GDP · Q2 2026</text>
          <text x="72" y="637" class="sans navy" font-size="24" font-weight="500" letter-spacing="5">YEAR-ON-YEAR</text>

          <rect x="68" y="678" width="5" height="94" rx="2.5" fill="${teal}"/>
          <text x="98" y="710" class="sans navy" font-size="22">Growth is one signal.</text>
          <text x="98" y="744" class="sans navy" font-size="22">The opportunity depends on where</text>
          <text x="98" y="778" class="sans navy" font-size="22">that momentum fits your business.</text>

          <g transform="translate(706,225)">
            <circle cx="30" cy="30" r="30" fill="${teal}"/>
            <text x="79" y="20" class="sans navy" font-size="22" font-weight="800">CONSUMPTION</text>
            <text x="79" y="50" class="sans slate" font-size="20">+1.3% YoY</text>

            <circle cx="30" cy="120" r="30" fill="${navy}"/>
            <text x="79" y="110" class="sans navy" font-size="22" font-weight="800">INVESTMENT</text>
            <text x="79" y="140" class="sans slate" font-size="20">GFCF +6.1% YoY</text>

            <circle cx="30" cy="210" r="30" fill="${teal}"/>
            <text x="79" y="200" class="sans navy" font-size="22" font-weight="800">EXPORTS</text>
            <text x="79" y="230" class="sans slate" font-size="20">Goods &amp; services +2.2% YoY</text>
          </g>

          <defs>
            <linearGradient id="topfade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="${cream}" stop-opacity="1"/>
              <stop offset="0.42" stop-color="${cream}" stop-opacity=".82"/>
              <stop offset="1" stop-color="${cream}" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="bottomshade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="${navy}" stop-opacity="0"/>
              <stop offset=".55" stop-color="${navy}" stop-opacity=".36"/>
              <stop offset="1" stop-color="#04182B" stop-opacity=".92"/>
            </linearGradient>
          </defs>
          <rect x="0" y="780" width="1080" height="180" fill="url(#topfade)"/>
          <rect x="0" y="1110" width="1080" height="240" fill="url(#bottomshade)"/>

          <circle cx="79" cy="1240" r="18" fill="${white}"/>
          <circle cx="79" cy="1240" r="7" fill="${navy}"/>
          <text x="111" y="1238" class="sans white" font-size="18" font-weight="800" letter-spacing="4">ATHENS</text>
          <text x="111" y="1267" class="sans white" font-size="18" letter-spacing="4">GREECE</text>

          <text x="66" y="1318" class="sans white" font-size="14">Source: ELSTAT, Quarterly National Accounts, Q2 2026</text>
          <text x="697" y="1245" class="sans white" font-size="17" font-weight="700" letter-spacing="4">CONNECT · DEVELOP · INVEST</text>
          <text x="740" y="1305" class="sans white" font-size="17" font-weight="700" letter-spacing="3">THESMARTYSOLUTION.COM</text>
          </svg>`);

          const top = await sharp({create:{width:W,height:H,channels:3,background:cream}})
            .composite([
              {input: photo, left:0, top:780},
              {input: svg, left:0, top:0},
              {input: logo, left:835, top:38}
            ])
            .jpeg({quality:94,chromaSubsampling:'4:4:4'})
            .toBuffer();

          await fs.writeFile('social/review-assets/tss-greece-q2-2026-feed.jpg', top);
          const m=await sharp(top).metadata();
          console.log(JSON.stringify({width:m.width,height:m.height,format:m.format,size:top.length}));
          NODE
      - name: Commit review asset
        run: |
          git config user.name "tss-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/review-assets/tss-greece-q2-2026-feed.jpg
          git commit -m "Build Greece Q2 2026 social review asset"
          git push origin main
