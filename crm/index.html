let sessionExpiry=0,loginGeneration=0;
async function rpc(fn,...args){
 let r;try{r=await fetch(CRM_API,{method:'POST',credentials:'omit',redirect:'follow',cache:'no-store',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({fn,args})});}catch(e){throw Error('Could not connect to the CRM. Check your internet connection and retry.');}
 if(!r.ok)throw Error('CRM temporarily unavailable. Please retry.');
 let data;try{data=await r.json()}catch(e){throw Error('Unexpected CRM response. Please retry.');}
 if(!data.ok)throw Error(data.error||'Request failed');return data.result;
}
async function call(fn,...args){const requestedSession=sessionToken;try{const r=await rpc(fn,requestedSession,...args);if(sessionToken!==requestedSession)throw Error('SESSION_CHANGED');return r}catch(e){if(String(e.message).includes('AUTH_REQUIRED')&&sessionToken===requestedSession){clearSession();showLogin('Your session ended. Please sign in again.');}throw e}}
function clearSession(removeTrusted=true){sessionToken='';sessionExpiry=0;state=null;loginGeneration++;if(removeTrusted){try{localStorage.removeItem(TRUSTED_SESSION_KEY)}catch(e){}}el('dialog').close();el('dialog').innerHTML='';el('nav').innerHTML='';el('main').innerHTML='';el('notice').textContent='';el('signOutButton').hidden=true;el('sync').textContent='Private workspace';}
function rememberTrustedSession(){if(!isInstalledApp()||!sessionToken)return;try{localStorage.setItem(TRUSTED_SESSION_KEY,JSON.stringify({token:sessionToken,serverExpiry:sessionExpiry,deviceExpiry:Date.now()+TRUSTED_SESSION_MAX_MS}))}catch(e){}}

function showCachedState(reason=''){const saved=loadCachedState();if(!saved)return false;state=saved.state;el('signOutButton').hidden=false;el('sync').textContent='Last synced '+new Date(saved.savedAt).toLocaleString();render();notice('CRM server unavailable. Showing your last synced workspace.'+(reason?' '+reason:''));return true}
async function restoreTrustedSession(){if(!isInstalledApp())return false;let saved;try{saved=JSON.parse(localStorage.getItem(TRUSTED_SESSION_KEY)||'null')}catch(e){}if(!saved?.token||!saved.deviceExpiry||Date.now()>=saved.deviceExpiry){clearSession(true);return false}sessionToken=saved.token;sessionExpiry=Number(saved.serverExpiry||0);try{await rpc('checkSession',sessionToken);await refresh();return true}catch(e){const msg=String(e.message||e);if(/AUTH_REQUIRED|SESSION_CHANGED/.test(msg)){clearSession(true);return false}if(showCachedState())return true;return false}}
async function showLogin(message=''){
 const generation=++loginGeneration;
 el('main').innerHTML='<section class="panel" style="max-width:490px;margin:35px auto"><h2>Admin login</h2><p class="muted">Sign in with your authorised TSS Google account.</p><p id="loginError" class="error" role="alert">'+esc(message)+'</p><div id="googleButton">Connecting to Google…</div><p class="muted" style="font-size:13px;margin-top:20px">Google handles your password. CRM access ends when you leave or reload this page, or after one hour.</p><a href="/">Back to the TSS website</a><p><button onclick="showLogin()">Retry login</button></p></section>';
 try{
  const challenge=await rpc('beginGoogleLogin');
  if(!window.google?.accounts?.id)await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=resolve;s.onerror=()=>reject(Error('Google sign-in could not load. Please retry.'));document.head.appendChild(s)});
  if(generation!==loginGeneration)return;
  google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,nonce:challenge.nonce,auto_select:false,callback:async response=>{
   if(generation!==loginGeneration)return;
   el('googleButton').textContent='Verifying your account…';
   try{const r=await rpc('googleSignIn',response.credential,challenge.nonce);if(generation!==loginGeneration){await rpc('signOut',r.token);return}sessionToken=r.token;sessionExpiry=r.expiresAt;rememberTrustedSession();await refresh();}catch(e){if(generation===loginGeneration)showLogin(e.message)}
  }});
  el('googleButton').textContent='';google.accounts.id.renderButton(el('googleButton'),{theme:'outline',size:'large',text:'signin_with',width:280});
 }catch(e){if(generation===loginGeneration&&el('loginError')){el('googleButton').textContent='';el('loginError').textContent=e.message}}
}
async function logout(all=false){const token=sessionToken;clearSession(true);window.google?.accounts?.id?.disableAutoSelect();showLogin('Signed out.');try{await rpc(all?'signOutAll':'signOut',token)}catch(e){notice('Local sign-out complete. The server session will expire automatically.')}}

function validateLoadedState(){
 const problems=[];
 for(const [entity,records] of Object.entries(state?.records||{})){
  if(!Array.isArray(records))continue;
  const seen=new Set();
  for(const r of records){
   if(!r?.id)continue;
   if(seen.has(r.id))problems.push('Duplicate ID in '+entity+': '+r.id);
   else seen.add(r.id);
  }
 }
 return problems;
}

function companyFilterOptions(key,labelText){const values=state.enums.Companies?.[key]||(key==='classification'?companyClassifications:uniqueCompanyValues(key));return '<label><span>'+labelText+'</span><select aria-label="'+labelText+'" onchange="companyFilters.'+key+'=this.value;page=0;drawRecords()"><option value="">All</option>'+values.map(v=>'<option value="'+esc(v)+'" '+(companyFilters[key]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select></label>'}
function clearCompanyFilters(){query='';companyFilters={district:'',category:'',status:'',priority:'',researchLevel:'',classification:''};companySort='asc';page=0;records()}
function toggleCompanyFilters(){const panel=el('companyFilters');const open=panel.classList.toggle('open');el('filterToggle').setAttribute('aria-expanded',String(open))}
function filtered(){let records=state.records[view];if(view==='Companies'){const searchFields=['name','category','district','classification','email','contactEmail','phone','services','notes'];const needle=query.trim().toLocaleLowerCase();records=records.filter(r=>Object.entries(companyFilters).every(([k,v])=>!v||String(r[k]||'')===v)&&(!needle||searchFields.some(k=>String(r[k]||'').toLocaleLowerCase().includes(needle))));return records.sort((a,b)=>(companySort==='desc'?-1:1)*String(a.name||'').localeCompare(String(b.name||''),undefined,{sensitivity:'base',numeric:true}))}return records.filter(r=>(!filter||(r.status||r.stage)===filter)&&(!query||Object.entries(r).filter(([k])=>!['version'].includes(k)).map(([k,v])=>k==='companyId'?company(v):v).join(' ').toLowerCase().includes(query.toLowerCase())))}
function records(){const status=state.enums[view]?.status||state.enums[view]?.stage||[];let controls;if(view==='Companies'){controls='<div class="toolbar company-search"><input id="companySearch" aria-label="Search companies" placeholder="Search company, email, phone, service or notes…" value="'+esc(query)+'" oninput="query=this.value;page=0;drawRecords()"><button id="filterToggle" class="mobile-filter-toggle" aria-expanded="false" aria-controls="companyFilters" onclick="toggleCompanyFilters()">Filters</button><button class="primary" onclick="edit(view)">Add company</button><button onclick="refresh()">Refresh</button></div><div id="companyFilters" class="filter-panel">'+companyFilterOptions('district','District')+companyFilterOptions('category','Category')+companyFilterOptions('status','Status')+companyFilterOptions('priority','Priority')+companyFilterOptions('researchLevel','Research level')+companyFilterOptions('classification','Classification')+'<label><span>Company name</span><select aria-label="Sort company name" onchange="companySort=this.value;page=0;drawRecords()"><option value="asc" '+(companySort==='asc'?'selected':'')+'>A to Z</option><option value="desc" '+(companySort==='desc'?'selected':'')+'>Z to A</option></select></label><div class="filter-actions"><button onclick="clearCompanyFilters()">Clear filters</button></div></div>'}else{controls='<div class="toolbar"><input aria-label="Search records" placeholder="Search names, notes and companies…" value="'+esc(query)+'" oninput="query=this.value;page=0;drawRecords()"><select aria-label="Filter status" onchange="filter=this.value;page=0;drawRecords()"><option value="">All statuses</option>'+status.map(s=>'<option '+(s===filter?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select><button class="primary" onclick="edit(view)">Add '+({Contacts:'person',Opportunities:'opportunity',Tickets:'ticket',Tasks:'follow-up'}[view])+'</button>'+(view==='Opportunities'?'<button onclick="board=!board;drawRecords()">Table / board</button>':'')+'<button onclick="refresh()">Refresh</button></div>'}el('main').innerHTML='<h2>'+titles[view]+'</h2><p class="muted">'+({Companies:'Research, relationships and the next conversation.',Contacts:'The people behind your relationships.',Opportunities:'Track commercial progress. Project value and TSS fees remain separate.',Tickets:'One place for enquiries, requests and client issues.',Tasks:'Every follow-up has a date and a clear next step.'}[view])+'</p>'+controls+'<div id="results"></div>';drawRecords()}
function drawRecords(){const all=filtered(),total=state.records[view].length,list=all.slice(page*30,(page+1)*30),summary=view==='Companies'?'<p class="results-summary muted" aria-live="polite">Showing <strong>'+all.length+'</strong> of <strong>'+total+'</strong> companies</p>':'';if(board&&view==='Opportunities'){el('results').innerHTML='<div class="board">'+state.enums.Opportunities.stage.map(s=>'<section class="column"><h3>'+esc(s)+' <span class="badge">'+all.filter(r=>r.stage===s).length+'</span></h3>'+all.filter(r=>r.stage===s).map(r=>card(view,r)).join('')+'</section>').join('')+'</div>';return}if(!all.length){const active=view==='Companies'&&(query||Object.values(companyFilters).some(Boolean));el('results').innerHTML=summary+'<div class="empty">'+(active||query||filter?'No matching records. Adjust the filters.':'No records yet. Add the first one above.')+'</div>';return}const cols={Companies:['name','category','classification','district','status','followUp'],Contacts:['name','companyId','role','email'],Opportunities:['name','companyId','stage','tssFee','currency','followUp'],Tickets:['name','companyId','priority','status','dueDate'],Tasks:['name','companyId','status','dueDate']}[view];el('results').innerHTML=summary+'<div class="table-wrap"><table><thead><tr>'+cols.map(k=>'<th>'+label(k)+'</th>').join('')+'</tr></thead><tbody>'+list.map(r=>'<tr>'+cols.map(k=>'<td>'+(k==='name'?'<button onclick="detail(\''+view+'\',\''+esc(r.id)+'\')">'+esc(r[k])+'</button>':k==='companyId'?esc(company(r[k])):esc(r[k]))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><div class="mobile-list list" style="display:none">'+list.map(r=>card(view,r)).join('')+'</div><div class="page-buttons"><span class="muted">'+(page*30+1)+'–'+Math.min((page+1)*30,all.length)+' of '+all.length+'</span><button '+(!page?'disabled':'')+' onclick="page--;drawRecords()">Previous</button><button '+((page+1)*30>=all.length?'disabled':'')+' onclick="page++;drawRecords()">Next</button></div>'}
function showDialog(title,html){el('dialog').innerHTML='<div class="modal-head"><h2>'+esc(title)+'</h2><button aria-label="Close" onclick="el(\'dialog\').close()">✕</button></div><div class="modal-body">'+html+'</div>';if(!el('dialog').open)el('dialog').showModal()}
function fieldHTML(entity,k,r){const opts=state.enums[entity]?.[k]||(entity==='Companies'&&k==='classification'?companyClassifications:null),refs={companyId:'Companies',opportunityId:'Opportunities',ticketId:'Tickets'},wide=['notes','nextAction','services','portfolio','fitAssessment','verificationNotes','businessAddress'].includes(k);let f='';if(opts)f='<select name="'+k+'">'+opts.map(s=>'<option '+(r[k]===s?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select>';else if(refs[k])f='<select name="'+k+'"><option value="">None</option>'+state.records[refs[k]].map(x=>'<option value="'+esc(x.id)+'" '+(r[k]===x.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>';else if(wide)f='<textarea name="'+k+'">'+esc(r[k])+'</textarea>';else f='<input name="'+k+'" type="'+(['dueDate','followUp'].includes(k)?'date':['projectValue','tssFee'].includes(k)?'number':['email','contactEmail'].includes(k)?'email':['website','instagram'].includes(k)?'url':'text')+'" '+(['projectValue','tssFee'].includes(k)?'min="0" step="0.01" ':'')+(k==='name'?'required maxlength="250" ':'')+'value="'+esc(r[k])+'">';return '<label class="'+(wide?'wide':'')+'"><span>'+label(k)+'</span>'+f+'</label>'}
function edit(entity,id='',companyId=''){const r=id?state.records[entity].find(x=>x.id===id):{companyId};const keys=state.fields[entity].filter(k=>!['id','version','createdAt','updatedAt','threadId'].includes(k));showDialog((id?'Edit ':'New ')+(titles[entity]||entity),'<form id="recordForm"><div class="fields">'+keys.map(k=>fieldHTML(entity,k,r)).join('')+'</div><p id="formError" class="error" role="alert"></p><div class="actions"><button type="button" onclick="el(\'dialog\').close()">Cancel</button><button class="primary" type="submit">Save record</button></div></form>');el('recordForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;const b=e.submitter;b.disabled=true;try{const data=Object.fromEntries(new FormData(e.target));if(id){data.id=id;data.version=r.version;if(r.threadId)data.threadId=r.threadId}const saved=await call('saveRecord',entity,data);if(id&&r){Object.assign(r,data);if(saved&&typeof saved==='object')Object.assign(r,saved);render();cacheState()}else if(saved&&saved.id&&state?.records?.[entity]){state.records[entity].push(saved);render();cacheState()}el('dialog').close();notice('Saved');await refresh()}catch(err){if(el('formError'))el('formError').textContent=err.message}finally{busy=false;b.disabled=false}}}
function detail(entity,id){const r=state.records[entity].find(x=>x.id===id);let html='<p class="muted">'+esc(r.id)+'</p><dl class="detail-grid">'+Object.entries(r).filter(([k,v])=>v&&!['id','version'].includes(k)).map(([k,v])=>'<div><dt>'+label(k)+'</dt><dd>'+(['website','instagram','source1','source2'].includes(k)&&/^https?:\/\/[^\s]+$/i.test(v)?'<a target="_blank" rel="noopener noreferrer" href="'+esc(v)+'">'+esc(v)+'</a>':esc(k==='companyId'?company(v):v))+'</dd></div>').join('')+'</dl><div class="actions"><button class="primary" onclick="edit(\''+entity+'\',\''+esc(id)+'\')">Edit</button></div>';if(entity==='Companies'){html+='<div class="toolbar">'+[['Contacts','Add person'],['Opportunities','Add opportunity'],['Tickets','New ticket'],['Tasks','Add follow-up']].map(([t,n])=>'<button onclick="edit(\''+t+'\',\'\',\''+esc(id)+'\')">'+n+'</button>').join('')+'</div>';['Contacts','Opportunities','Tickets','Tasks'].forEach(t=>{const linked=state.records[t].filter(x=>x.companyId===id);html+='<section class="section"><h3>'+titles[t]+'</h3><div class="list">'+(linked.map(x=>card(t,x)).join('')||'<span class="muted">None linked yet.</span>')+'</div></section>'})}const activity=state.records.Activity.filter(a=>a.recordId===id);html+='<section class="section"><h3>Activity</h3>'+activity.map(a=>'<p>'+esc(a.action)+' · '+esc(new Date(a.createdAt).toLocaleString())+'</p>').join('')+'</section>';showDialog(r.name,html)}
function reports(){const r=state.records,counts=(type,k)=>{const c={};r[type].forEach(x=>c[x[k]||'Unspecified']=(c[x[k]||'Unspecified']||0)+1);return Object.entries(c).map(([n,v])=>'<div class="row"><span>'+esc(n)+'</span><strong>'+v+'</strong></div>').join('')||'<p class="muted">No records yet.</p>'};const fee={};r.Opportunities.filter(x=>x.stage==='Won').forEach(x=>{fee[x.currency]=(fee[x.currency]||0)+Number(x.tssFee||0)});el('main').innerHTML='<h2>Reports</h2><p class="muted">Current records, without assumed conversion rates or investment appetite.</p><div class="grid"><section class="panel"><h3>Company qualification</h3>'+counts('Companies','status')+'</section><section class="panel"><h3>Opportunity stages</h3>'+counts('Opportunities','stage')+'</section><section class="panel"><h3>Ticket status</h3>'+counts('Tickets','status')+'</section><section class="panel"><h3>TSS fees on won opportunities</h3>'+ (Object.entries(fee).map(([c,v])=>'<p><strong>'+esc(c)+' '+v.toLocaleString()+'</strong></p>').join('')||'<p class="muted">No won fees recorded.</p>')+'<small class="muted">These are recorded opportunity fees, not confirmed invoices or payments.</small></section></div>'}
function assistant(){el('main').innerHTML='<h2>Assistant</h2><p class="muted">Ask about your working day or select a record for a focused review.</p><section class="panel"><h3>AI assistant</h3><p>'+ (state.aiEnabled?'Connected. Selected record content and your question are sent to Groq to generate the answer.':'The AI connection is not active yet. Your CRM works independently.')+'</p><form id="aiForm"><label><span>Context</span><select id="aiContext"><option value="">Working-day snapshot</option>'+['Companies','Opportunities','Tickets','Tasks'].map(t=>'<optgroup label="'+titles[t]+'">'+state.records[t].map(r=>'<option value="'+t+':'+esc(r.id)+'">'+esc(r.name)+'</option>').join('')+'</optgroup>').join('')+'</select></label><label style="margin-top:16px"><span>Your question</span><textarea id="aiQuestion" maxlength="3000" placeholder="Summarize this record and suggest the next action." required></textarea></label><div class="actions"><button type="submit" class="primary" '+(!state.aiEnabled?'disabled':'')+'>Ask assistant</button></div></form><div id="aiAnswer" style="white-space:pre-wrap" role="status"></div></section><section class="panel section"><h3>Email capture</h3><p>'+ (state.emailEnabled?'Connected to thesmartysolution@gmail.com. Relevant incoming emails are checked every 15 minutes. No emails are sent automatically.':'Gmail capture is awaiting connection. You can create tickets manually.')+'</p>'+(state.emailError?'<p class="error">'+esc(state.emailError)+'</p>':'')+(state.emailEnabled?'<button onclick="syncInbox()">Check inbox now</button>':'')+'<p class="muted">The info@thesmartysolution.com mailbox is not connected yet.</p></section>';el('aiForm').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;el('aiAnswer').textContent='Preparing an answer…';try{const context=el('aiContext').value.split(':');const result=await call('askAssistant',el('aiQuestion').value,context[0]||'',context[1]||'');if(el('aiAnswer'))el('aiAnswer').textContent=result.answer}catch(err){if(el('aiAnswer'))el('aiAnswer').textContent=err.message}finally{button.disabled=false}}}
async function syncInbox(){try{const r=await call('syncEmail');notice(r.created+' new tickets, '+r.updated+' updated');await refresh()}catch(e){notice(e.message)}}
