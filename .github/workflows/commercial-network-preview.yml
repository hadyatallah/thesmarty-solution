name: TSS Commercial Network preview acceptance
on:
  push:
    branches:
      - cn-opportunity-workspace-preview-20261007
    paths:
      - 'crm/commercial-network-preview.html'
      - 'crm/commercial-network-preview.js'
      - 'crm/index.html'
      - 'tests/browser-commercial-network-preview.py'
      - '.github/workflows/commercial-network-preview.yml'
permissions:
  contents: read
jobs:
  preview-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run protected CRM frontend regressions
        run: node --test tests/urgent*.test.mjs tests/dashboard.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser-test dependency
        run: python -m pip install playwright==1.63.0
      - name: Install isolated Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Commercial Network desktop tablet mobile acceptance
        run: python tests/browser-commercial-network-preview.py
