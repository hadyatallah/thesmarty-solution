name: TSS public enquiry frontend safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'script.js'
      - 'anti-spam.js'
      - 'contact.html'
      - 'hubspot-native-forms.js'
      - 'tests/hubspot-native-forms.test.mjs'
      - 'docs/g5-native-hubspot-forms.md'
      - 'kiti-enquiry.html'
      - 'tests/enquiry-transport.test.mjs'
      - 'tests/browser-enquiry.py'
      - '.github/workflows/enquiry-frontend.yml'
permissions:
  contents: read
concurrency:
  group: tss-enquiry-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and isolated transport plus existing CRM safety tests
        run: |
          node --check script.js
          node --check hubspot-native-forms.js
          node --check anti-spam.js
          node --test tests/enquiry-transport.test.mjs tests/hubspot-native-forms.test.mjs tests/urgent*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test dependency
        run: python -m pip install playwright==1.63.0
      - name: Install isolated test browser
        run: python -m playwright install --with-deps chromium
      - name: Test actual public forms with intercepted synthetic responses only
        run: python tests/browser-enquiry.py
      - name: Preserve prior CRM cache and command routing safety
        run: |
          python tests/browser-cache-regression.py
          python tests/browser-command-routing.py
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enquiry-frontend-evidence
          path: evidence/enquiry/
          retention-days: 14
          if-no-files-found: warn
