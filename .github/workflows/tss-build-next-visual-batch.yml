name: TSS build next visual batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tss-build-next-visual-batch.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build dedicated visual assets
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import sharp from 'sharp';
          import { execFileSync } from 'node:child_process';
          import { renderCreative } from './social/lib/render.js';
          import { sha256, imageFingerprint, visualSignature, LOGO_SHA } from './social/lib/qa.js';
          import { analyzeVideo } from './social/lib/export-qa.js';

          const catalog = JSON.parse(await fs.readFile('social/photo-catalog.json','utf8'));
          const files = [
            '2026-09-20-building-permits-feed.json',
            '2026-09-20-business-electricity-feed.json',
            '2026-09-20-business-entity-choice-story.json',
            '2026-09-20-construction-material-cost-story.json',
            '2026-09-20-cyprus-tax-residence-story.json',
            '2026-09-20-job-vacancy-rate-story.json',
            '2026-09-20-labour-cost-story.json',
            '2026-09-20-labour-market-reel.json',
            '2026-09-20-partner-capability-feed.json',
            '2026-09-20-rppi-drivers-feed.json',
            '2026-09-20-small-pilot-feed.json',
            '2026-09-20-tourist-arrivals-story.json'
          ];
          const photos = {
            '2026-09-20-building-permits-feed':'larnaca-castle',
            '2026-09-20-business-electricity-feed':'paphos-castle',
            '2026-09-20-business-entity-choice-story':'lefkara',
            '2026-09-20-construction-material-cost-story':'petra-tou-romiou',
            '2026-09-20-cyprus-tax-residence-story':'larnaca-castle',
            '2026-09-20-job-vacancy-rate-story':'lefkara',
            '2026-09-20-labour-cost-story':'petra-tou-romiou',
            '2026-09-20-labour-market-reel':'finikoudes',
            '2026-09-20-partner-capability-feed':'lefkara',
            '2026-09-20-rppi-drivers-feed':'finikoudes',
            '2026-09-20-small-pilot-feed':'petra-tou-romiou',
            '2026-09-20-tourist-arrivals-story':'paphos-castle'
          };
          const dataFeed = {
            '2026-09-20-building-permits-feed': {
              metric:'+21.1%', metricLabel:'BUILDING PERMITS | MAY 2026 YOY',
              fact1Label:'WHAT IT MEASURES', fact1Body:'Authorised construction activity.',
              fact2Label:'WHAT IT DOES NOT', fact2Body:'Property sales or rental demand.'
            },
            '2026-09-20-business-electricity-feed': {
              metric:'€24.29', metricLabel:'PER 100 KWH | CYPRUS NON-HOUSEHOLD',
              fact1Label:'EU AVERAGE', fact1Body:'€18.37 per 100 kWh in H2 2025.',
              fact2Label:'SCOPE', fact2Body:'Annual use of 500 to 2,000 MWh.'
            },
            '2026-09-20-rppi-drivers-feed': {
              metric:'Q1 2026', metricLabel:'RPPI CONTINUED UPWARD TREND',
              fact1Label:'DEMAND', fact1Body:'Strong purchase demand, mainly foreign buyers.',
              fact2Label:'SUPPLY + COSTS', fact2Body:'Construction costs rose while supply increased gradually.'
            }
          };
          const shortBody = {
            '2026-09-20-business-entity-choice-story':'Company, partnership, business name and overseas place of business carry different registration costs and liability structures.',
            '2026-09-20-construction-material-cost-story':'Construction materials prices were 3.39% higher year on year in August 2026. Input costs are not a property-price forecast.',
            '2026-09-20-cyprus-tax-residence-story':'Cyprus has a 183-day rule and a conditional 60-day route. The 60-day route requires all listed conditions.',
            '2026-09-20-job-vacancy-rate-story':'CYSTAT reports a 2.6% job vacancy rate in Q2 2026. It does not predict hiring difficulty for a specific role.',
            '2026-09-20-labour-cost-story':'The provisional Labour Cost Index was 3.8% higher year on year in Q2 2026. An index change is not a salary quote.',
            '2026-09-20-tourist-arrivals-story':'August 2026 arrivals were 581,880, down 3.3% year on year. One month does not establish a long-term trend.'
          };

          await fs.mkdir('social/assets',{recursive:true});
          await fs.mkdir('social-results/reel-scenes',{recursive:true});

          async function saveFrame(creative){
            const {buffer,layout}=await renderCreative(creative);
            const meta=await sharp(buffer).metadata();
            const ext=meta.format==='jpeg'?'jpg':'png';
            const hash=sha256(buffer);
            const path=`social/assets/${hash}.${ext}`;
            const layoutText=JSON.stringify(layout,null,2)+'\n';
            await fs.writeFile(path,buffer);
            await fs.writeFile(path+'.layout.json',layoutText);
            return {path,sha256:hash,pixelHash:await imageFingerprint(buffer),visualSignature:await visualSignature(buffer),layoutSha256:sha256(layoutText),width:layout.width,height:layout.height,originFormat:creative.format,commit:null};
          }

          for(const file of files){
            const path='content-queue/'+file;
            const item=JSON.parse(await fs.readFile(path,'utf8'));
            const key=photos[item.id];
            const p=catalog.photos[key];
            if(!p?.approved || !p.republicControlled) throw new Error('Unapproved photo '+key);
            item.geography={mode:'verified-republic-location',location:p.location,photoSha256:p.sha256,evidenceUrl:p.evidenceUrl,republicControlled:true,reviewNote:p.reviewNote};
            item.creative.photoKey=key;
            item.creative.logoSha256=LOGO_SHA;
            item.creative.compositionReady=true;
            item.creativeKey=item.creativeKey.replace('pending-photo',key);

            if(item.format==='feed' && dataFeed[item.id]){
              item.creative.visualStyle='reference-data-editorial';
              item.creative.template='insight-data';
              Object.assign(item.creative.text,dataFeed[item.id],{location:p.location.toUpperCase()});
              item.asset=await saveFrame(item.creative);
            } else if(item.format==='feed'){
              item.creative.visualStyle='reference-integrated-editorial';
              item.creative.template='question-debate';
              item.creative.text.location=p.location.toUpperCase();
              item.asset=await saveFrame(item.creative);
            } else if(item.format==='story'){
              item.creative.visualStyle='reference-vertical-photo';
              item.creative.template='place-opportunity';
              item.creative.text.body=shortBody[item.id];
              item.creative.text.location=p.location.toUpperCase();
              item.asset=await saveFrame(item.creative);
            } else if(item.format==='reel'){
              item.creative.visualStyle='reference-vertical-photo';
              item.creative.template='place-opportunity';
              item.creative.sceneDurationSeconds=5;
              item.creative.scenes=[
                {photoKey:'finikoudes',category:'CYPRUS BUSINESS',headline:'CYPRUS UNEMPLOYMENT: 3.6% IN Q2.',body:'CYSTAT Labour Force Survey | Q2 2026',question:'A national measure, not a role-specific hiring forecast.',location:'FINIKOUDES / LARNACA',source:'CYSTAT | Q2 2026'},
                {photoKey:'lefkara',category:'CYPRUS BUSINESS',headline:'WHAT DOES 3.6% ACTUALLY TELL YOU?',body:'It describes the national labour market.',question:'It does not price a specific skill set.',location:'PANO LEFKARA / CYPRUS',source:'CYSTAT | Q2 2026'},
                {photoKey:'larnaca-castle',category:'CYPRUS BUSINESS',headline:'CHECK THE ROLE, NOT JUST THE RATE.',body:'Availability can differ by occupation, seniority and location.',question:'Which factor would you check first?',location:'LARNACA / CYPRUS',source:'TSS | EVIDENCE CHECK'},
                {photoKey:'paphos-castle',category:'CYPRUS BUSINESS',headline:'BUILD FROM THE EVIDENCE.',body:'Use national indicators as context, then verify the specific hiring market.',question:'THE SMARTY SOLUTION',location:'PAPHOS / CYPRUS',source:'CONNECT · DEVELOP · INVEST'}
              ];
              const sceneAssets=[];
              for(let i=0;i<item.creative.scenes.length;i++){
                const sc=item.creative.scenes[i];
                const frameCreative={...item.creative,photoKey:sc.photoKey,text:sc};
                const a=await saveFrame(frameCreative);
                sceneAssets.push(a);
                await fs.copyFile(a.path,`social-results/reel-scenes/frame-${String(i+1).padStart(2,'0')}.png`);
              }
              const output='social-results/reel-scenes/export.mp4';
              execFileSync('ffmpeg',['-v','error','-y','-framerate','1/5','-i','social-results/reel-scenes/frame-%02d.png','-t','20','-c:v','libx264','-threads','2','-r','30','-pix_fmt','yuv420p','-crf','20','-an','-movflags','+faststart',output],{timeout:60000});
              const buffer=await fs.readFile(output),hash=sha256(buffer),assetPath=`social/assets/${hash}.mp4`,evidence=await analyzeVideo(buffer);
              await fs.writeFile(assetPath,buffer);
              item.asset={path:assetPath,sha256:hash,pixelHash:evidence.pixelHash,videoVisual:evidence.videoVisual,videoQA:{sha256:hash,width:1080,height:1920,duration:20,codec:'h264',pixelFormat:'yuv420p',fullDecodePassed:true},width:1080,height:1920,originFormat:'reel',commit:null,sceneAssets};
            }
            item.planning={...item.planning,requiresComposition:false,requiresPhotoSelection:false,requiresFinalExportReview:true,note:'Dedicated mandatory-picture export created. Final visual inspection and QA seal still required before approval.'};
            await fs.writeFile(path,JSON.stringify(item,null,2)+'\n');
          }
          NODE
      - name: Commit immutable assets
        run: |
          git config user.name "TSS Social Automation"
          git config user.email "actions@users.noreply.github.com"
          git add content-queue social/assets
          git commit -m "Build mandatory-picture TSS social batch"
          git push origin HEAD:main
          echo "ASSET_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Bind assets to immutable commit
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const commit=process.env.ASSET_COMMIT;
          const files=(await fs.readdir('content-queue')).filter(f=>f.startsWith('2026-09-20-')&&f.endsWith('.json'));
          for(const f of files){
            const p='content-queue/'+f;
            const x=JSON.parse(await fs.readFile(p,'utf8'));
            if(!x.asset?.path) continue;
            x.asset.commit=commit;
            for(const a of x.asset.sceneAssets||[]) a.commit=commit;
            await fs.writeFile(p,JSON.stringify(x,null,2)+'\n');
          }
          NODE
          git add content-queue
          git commit -m "Bind TSS visual batch to immutable assets"
          git push origin HEAD:main
