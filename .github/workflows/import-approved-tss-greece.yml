name: Import approved TSS social asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-approved-tss-greece.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Download approved Canva render and bind asset
        env:
          ASSET_URL: "https://media.canva.com/v2/document-image/hash:1294936181/height:1350/id:DAHUr143tt0/type:B/width:1080?brand=BAD9PkuBnI0&csig=AAAAAAAAAAAAAAAAAAAAAApH578pcq2nzr-qbv17UgMHQWfb0E6OPcLvK3jlDoeD&exp=1789929771&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2F43tt0%2FDAHUr143tt0%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260920%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260920T114151Z%26X-Amz-Expires%3D27960%26X-Amz-Signature%3D6384692b354c1c0185c7531834a30ce06217f634e4d545c1723d862b21b655b4%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSun%252C%252020%2520Sep%25202026%252019%253A27%253A51%2520GMT&fallbackstale=T&osig=AAAAAAAAAAAAAAAAAAAAAFlP3SqoP7E6Au1njyDuBx2H2PqH--o3OpFpxBOvuhwl&page=1&signed=brand%2Cfallback%2Cfallbackstale%2Cpage%2Cversion&signer=document-rpc&version=2"
        run: |
          set -euo pipefail
          mkdir -p social/assets social/imported-assets
          curl --fail --location --silent --show-error "$ASSET_URL" -o /tmp/tss-greece.png
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import sharp from 'sharp';
          import { sha256, imageFingerprint, visualSignature } from './social/lib/qa.js';
          const bytes = await fs.readFile('/tmp/tss-greece.png');
          const meta = await sharp(bytes).metadata();
          if (meta.width !== 1080 || meta.height !== 1350) throw new Error(`Expected 1080x1350, got ${meta.width}x${meta.height}`);
          if (!['png','jpeg'].includes(meta.format)) throw new Error(`Unexpected format ${meta.format}`);
          const sha = sha256(bytes);
          const ext = meta.format === 'jpeg' ? 'jpg' : 'png';
          const assetPath = `social/assets/${sha}.${ext}`;
          await fs.writeFile(assetPath, bytes);
          const record = {
            id: 'tss-test-greece-q2-2026-feed',
            asset: {
              path: assetPath,
              sha256: sha,
              pixelHash: await imageFingerprint(bytes),
              visualSignature: await visualSignature(bytes),
              width: meta.width,
              height: meta.height,
              originFormat: 'feed',
              commit: null
            }
          };
          await fs.writeFile('social/imported-assets/tss-test-greece-q2-2026-feed.json', JSON.stringify(record, null, 2) + '\n');
          console.log(JSON.stringify(record));
          NODE
      - name: Commit imported asset
        run: |
          git config user.name "tss-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/assets social/imported-assets/tss-test-greece-q2-2026-feed.json
          git commit -m "Import approved Greece social test asset"
          git push origin main
