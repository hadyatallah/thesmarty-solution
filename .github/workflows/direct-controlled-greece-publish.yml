name: Direct controlled Greece publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-controlled-greece-publish.yml'

permissions:
  contents: read

concurrency:
  group: tss-instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dry run, publish, and verify exact approved asset
        env:
          TSS_PUBLISHER_KEY: ${{ secrets.TSS_PUBLISHER_KEY }}
          PUBLISHER_URL: https://thesmarty-solution-agent.vercel.app/api/publish-instagram
        run: |
          mkdir -p social-results
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';

          const item = JSON.parse(await fs.readFile('content-queue/tss-test-greece-q2-2026-feed.json','utf8'));
          const key = process.env.TSS_PUBLISHER_KEY;
          const url = process.env.PUBLISHER_URL;
          if (!key) throw new Error('Missing TSS_PUBLISHER_KEY');

          const sign = payload => crypto.createHmac('sha256',key).update(JSON.stringify(payload)).digest('hex');
          async function request(body) {
            const res = await fetch(url,{
              method:'POST',
              headers:{'Content-Type':'application/json','x-tss-publisher-key':key},
              body:JSON.stringify(body),
              redirect:'error',
              signal:AbortSignal.timeout(60000)
            });
            const data = await res.json().catch(()=>({}));
            if (!(res.ok && data.ok)) {
              const err = new Error(data.error || `Publisher HTTP ${res.status}`);
              err.meta = data.meta;
              throw err;
            }
            return data;
          }
          async function op(action,extra={}) {
            const payload={action,item,...extra};
            return request({payload,signature:sign(payload)});
          }

          const result={id:item.id,startedAt:new Date().toISOString(),assetSha256:item.asset.sha256,platforms:item.platforms};
          try {
            result.dryRun = await op('dryRun');
            await fs.writeFile('social-results/controlled-greece-result.json',JSON.stringify(result,null,2)+'\n');

            const prepared = await op('prepare');
            result.instagram={containerId:prepared.containerId};
            await fs.writeFile('social-results/controlled-greece-result.json',JSON.stringify(result,null,2)+'\n');

            const ticket=sign({id:item.id,assetSha256:item.asset.sha256,containerId:prepared.containerId,format:item.format});
            const igPub=await op('publishInstagram',{containerId:prepared.containerId,ticket});
            result.instagram.mediaId=igPub.mediaId;
            await fs.writeFile('social-results/controlled-greece-result.json',JSON.stringify(result,null,2)+'\n');

            const igCheck=await request({action:'verifyInstagram',mediaId:igPub.mediaId});
            result.instagram.permalink=igCheck.media?.permalink;
            result.instagram.verifiedCaption=igCheck.media?.caption===item.caption;
            if (!result.instagram.verifiedCaption) throw new Error('Instagram caption verification failed');
            await fs.writeFile('social-results/controlled-greece-result.json',JSON.stringify(result,null,2)+'\n');

            const fbPub=await op('publishFacebook');
            result.facebook={postId:fbPub.postId,photoId:fbPub.photoId};
            await fs.writeFile('social-results/controlled-greece-result.json',JSON.stringify(result,null,2)+'\n');

            const fbCheck=await request({action:'verifyFacebook',postId:fbPub.postId});
            result.facebook.permalink=fbCheck.media?.permalink_url;
            result.facebook.verifiedCaption=fbCheck.media?.message===item.caption;
            if (!result.facebook.verifiedCaption) throw new Error('Facebook caption verification failed');

            result.completedAt=new Date().toISOString();
            result.verified=true;
            await fs.writeFile('social-results/controlled-greece-result.json',JSON.stringify(result,null,2)+'\n');
            console.log('CONTROLLED_PUBLICATION_SUCCESS');
            console.log(JSON.stringify({instagram:result.instagram,facebook:result.facebook}));
          } catch (e) {
            result.failedAt=new Date().toISOString();
            result.error=e.message;
            result.safeMeta=e.meta || null;
            await fs.writeFile('social-results/controlled-greece-result.json',JSON.stringify(result,null,2)+'\n');
            console.error('CONTROLLED_PUBLICATION_FAILED',JSON.stringify(result));
            process.exit(1);
          }
          NODE
      - name: Retain publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tss-greece-live-result-${{ github.run_id }}
          path: social-results/
          if-no-files-found: error
          retention-days: 30
