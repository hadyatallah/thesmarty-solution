name: TSS PDF baseline capture
on:
  push:
    branches: ['feat/crm-pdf-attachments-20261005']
    paths: ['.github/workflows/tss-pdf-capture.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 68b91a8aeab3029db19a55bf1260e019fd7bc499
          persist-credentials: false
      - name: Capture exact pre-change tracked source
        run: |
          mkdir -p /tmp/tss-pdf-baseline
          git archive --format=tar.gz HEAD > /tmp/tss-pdf-baseline/baseline-source.tar.gz
          git rev-parse HEAD > /tmp/tss-pdf-baseline/commit.txt
          git ls-tree -r HEAD > /tmp/tss-pdf-baseline/git-tree.txt
          sha256sum /tmp/tss-pdf-baseline/baseline-source.tar.gz > /tmp/tss-pdf-baseline/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tss-pdf-baseline-68b91a8
          path: /tmp/tss-pdf-baseline/
          retention-days: 7
          if-no-files-found: error
