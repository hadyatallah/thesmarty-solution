name: Build TSS Greece final review asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-greece-final-review.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Download verified Athens photo
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error             'https://images.pexels.com/photos/6924327/pexels-photo-6924327.jpeg?cs=srgb&dl=pexels-mohammed-zar-3861716-6924327.jpg&fm=jpg'             -o /tmp/athens.jpg
      - name: Render final TSS review asset
        run: |
          set -euo pipefail
          mkdir -p social/review-assets
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import sharp from 'sharp';

          const W=1080,H=1350;
          const cream='#F7F3EA', navy='#082746', teal='#1696A6', slate='#53687A', white='#FFFFFF';

          const photo = await sharp('/tmp/athens.jpg')
            .resize(W, 650, {fit:'cover', position:'centre'})
            .modulate({brightness:0.98, saturation:0.96})
            .jpeg({quality:95})
            .toBuffer();

          let logo = null;
          try {
            const raw = await fs.readFile('logo-mark.png');
            logo = await sharp(raw).trim().resize({width:150}).png().toBuffer();
          } catch {}

          const svg = Buffer.from(`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="photoBlend" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="${cream}" stop-opacity="1"/>
                <stop offset="0.48" stop-color="${cream}" stop-opacity=".62"/>
                <stop offset="1" stop-color="${cream}" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#04182B" stop-opacity="0"/>
                <stop offset=".55" stop-color="#04182B" stop-opacity=".35"/>
                <stop offset="1" stop-color="#04182B" stop-opacity=".90"/>
              </linearGradient>
            </defs>
            <style>
              .sans{font-family:DejaVu Sans,Arial,sans-serif}
              .navy{fill:${navy}}
              .teal{fill:${teal}}
              .slate{fill:${slate}}
              .white{fill:${white}}
            </style>

            <rect width="1080" height="1350" fill="${cream}"/>

            <text x="68" y="72" class="sans slate" font-size="19" font-weight="700" letter-spacing="7">GREECE ECONOMY</text>

            <text x="68" y="212" class="sans navy" font-size="82" font-weight="800">GREECE</text>
            <text x="68" y="300" class="sans teal" font-size="82" font-weight="800">IS GROWING.</text>

            <text x="68" y="374" class="sans navy" font-size="30" font-weight="500" letter-spacing="4">BUT WHAT IS DRIVING</text>
            <text x="68" y="416" class="sans navy" font-size="30" font-weight="500" letter-spacing="4">THE MOMENTUM?</text>

            <text x="68" y="585" class="sans teal" font-size="132" font-weight="800">+1.9%</text>
            <text x="72" y="630" class="sans navy" font-size="25" font-weight="800">REAL GDP · Q2 2026</text>
            <text x="72" y="670" class="sans navy" font-size="23" font-weight="500" letter-spacing="5">YEAR-ON-YEAR</text>

            <g transform="translate(700,220)">
              <circle cx="30" cy="30" r="28" fill="${teal}"/>
              <text x="78" y="19" class="sans navy" font-size="21" font-weight="800">CONSUMPTION</text>
              <text x="78" y="49" class="sans slate" font-size="19">+1.3% YoY</text>

              <circle cx="30" cy="118" r="28" fill="${navy}"/>
              <text x="78" y="108" class="sans navy" font-size="21" font-weight="800">INVESTMENT</text>
              <text x="78" y="138" class="sans slate" font-size="19">GFCF +6.1% YoY</text>

              <circle cx="30" cy="206" r="28" fill="${teal}"/>
              <text x="78" y="196" class="sans navy" font-size="21" font-weight="800">EXPORTS</text>
              <text x="78" y="226" class="sans slate" font-size="19">Goods &amp; services +2.2% YoY</text>
            </g>

            <rect x="68" y="705" width="5" height="98" rx="2.5" fill="${teal}"/>
            <text x="98" y="738" class="sans navy" font-size="22">Growth is one signal.</text>
            <text x="98" y="773" class="sans navy" font-size="22">The opportunity depends on where</text>
            <text x="98" y="808" class="sans navy" font-size="22">that momentum fits your business.</text>

            <rect x="0" y="700" width="1080" height="150" fill="url(#photoBlend)"/>
            <rect x="0" y="1090" width="1080" height="260" fill="url(#bottomShade)"/>

            <circle cx="78" cy="1234" r="18" fill="${white}"/>
            <circle cx="78" cy="1234" r="7" fill="${navy}"/>
            <text x="112" y="1232" class="sans white" font-size="18" font-weight="800" letter-spacing="4">ATHENS</text>
            <text x="112" y="1263" class="sans white" font-size="18" letter-spacing="4">GREECE</text>

            <text x="58" y="1318" class="sans white" font-size="14">Source: ELSTAT, Quarterly National Accounts, Q2 2026</text>
            <text x="696" y="1246" class="sans white" font-size="16" font-weight="700" letter-spacing="3.3">CONNECT · DEVELOP · INVEST</text>
            <text x="740" y="1310" class="sans white" font-size="16" font-weight="700" letter-spacing="2.8">THESMARTYSOLUTION.COM</text>

            <text x="760" y="78" class="sans navy" font-size="24" font-weight="700">The Smarty Solution</text>
            <text x="774" y="108" class="sans slate" font-size="13" letter-spacing="2.4">CONNECT · DEVELOP · INVEST</text>
          </svg>`);

          const layers = [
            {input: photo, left:0, top:700},
            {input: svg, left:0, top:0},
          ];
          if (logo) layers.push({input:logo,left:885,top:30});

          const out = await sharp({create:{width:W,height:H,channels:3,background:cream}})
            .composite(layers)
            .jpeg({quality:95,chromaSubsampling:'4:4:4'})
            .toBuffer();

          await fs.writeFile('social/review-assets/tss-greece-q2-2026-final-review.jpg', out);
          const m = await sharp(out).metadata();
          console.log(JSON.stringify({width:m.width,height:m.height,format:m.format,size:out.length}));
          NODE
      - name: Commit final review asset
        run: |
          git config user.name "tss-social-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social/review-assets/tss-greece-q2-2026-final-review.jpg
          git commit -m "Build Greece final review asset"
          git push origin main
