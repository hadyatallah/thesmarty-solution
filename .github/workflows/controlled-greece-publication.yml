name: Controlled TSS Greece publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/controlled-greece-publication.yml'

permissions:
  contents: write

concurrency:
  group: tss-instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng ffmpeg
      - name: Run semi-automated compatible safety tests
        run: |
          node --test             social/tests/draft-planner.test.js             social/tests/editorial-intelligence.test.js             social/tests/editorial-regressions.test.js             social/tests/pipeline.test.js             social/tests/publication-run.test.js             social/tests/publisher-contract.test.js             social/tests/video.test.js
      - name: Process explicitly approved controlled publication
        env:
          TSS_PUBLISHER_KEY: ${{ secrets.TSS_PUBLISHER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node social/scripts/process-queue.js
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tss-controlled-greece-${{ github.run_id }}
          path: social-results/
          if-no-files-found: ignore
          retention-days: 30
