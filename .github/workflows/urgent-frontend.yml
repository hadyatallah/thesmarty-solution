name: TSS isolated frontend safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'crm/service-worker.js'
      - 'crm/assistant.js'
      - 'crm/command-center.js'
      - 'command-center/**'
      - 'tests/urgent*.test.mjs'
      - 'tests/browser-cache-regression.py'
      - 'tests/browser-command-routing.py'
      - '.github/workflows/urgent-frontend.yml'
permissions:
  contents: read
concurrency:
  group: tss-frontend-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated router and cache regression tests
        run: node --test tests/urgent*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser-test dependency
        run: python -m pip install playwright==1.63.0
      - name: Install isolated test browser
        run: python -m playwright install --with-deps chromium
      - name: Test actual service-worker lifecycle with synthetic localhost data
        run: python tests/browser-cache-regression.py
      - name: Test actual frontend modules and submit handler with synthetic localhost data
        run: python tests/browser-command-routing.py
