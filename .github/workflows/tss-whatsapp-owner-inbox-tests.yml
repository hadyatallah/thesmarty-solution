name: WhatsApp owner inbox security tests
on:
  push:
    paths:
      - 'api/tss-whatsapp-inbox.js'
      - 'lib/tssWhatsappInbox.mjs'
      - 'whatsapp-inbox/**'
      - 'tests/tssWhatsappInbox.test.mjs'
      - '.github/workflows/tss-whatsapp-owner-inbox-tests.yml'
  pull_request:
    paths:
      - 'api/tss-whatsapp-inbox.js'
      - 'lib/tssWhatsappInbox.mjs'
      - 'whatsapp-inbox/**'
      - 'tests/tssWhatsappInbox.test.mjs'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --check lib/tssWhatsappInbox.mjs
      - run: node --check api/tss-whatsapp-inbox.js
      - run: node --check whatsapp-inbox/app.js
      - run: node --test tests/tssWhatsappInbox.test.mjs
