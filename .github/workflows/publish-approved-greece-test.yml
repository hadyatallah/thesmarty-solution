name: Publish approved Greece test post

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-approved-greece-test.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare approved queue item and controlled publication
        run: |
          set -euo pipefail
          git config user.name "tss-social-bot"
          git config user.email "actions@users.noreply.github.com"

          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import sharp from 'sharp';
          import crypto from 'node:crypto';
          import { sha256, imageFingerprint, visualSignature, binding, userApprovalBinding, CHECKS, LOGO_SHA } from './social/lib/qa.js';

          const reviewPath='social/review-assets/tss-greece-q2-2026-feed.jpg';
          const bytes=await fs.readFile(reviewPath);
          const meta=await sharp(bytes).metadata();
          if (meta.width!==1080 || meta.height!==1350 || meta.format!=='jpeg') throw new Error('Approved review asset is not the required 1080x1350 JPEG');
          const hash=sha256(bytes);
          const assetPath=`social/assets/${hash}.jpg`;
          await fs.mkdir('social/assets',{recursive:true});
          await fs.writeFile(assetPath,bytes);

          const sourceChecked=new Date().toISOString();
          const validUntil=new Date(Date.now()+7*86400000).toISOString();
          const reviewedAt=new Date().toISOString();

          const photo=await fetch('https://upload.wikimedia.org/wikipedia/commons/2/25/Acropolis_Parthenon_Athens_Greece.jpg').then(r=>{if(!r.ok) throw new Error('Photo evidence unavailable'); return r.arrayBuffer()});
          const photoSha=sha256(Buffer.from(photo));

          const caption=`Greece's economy continued to expand in Q2 2026.

Real GDP increased 1.9% year on year. Total final consumption expenditure increased 1.3%, gross fixed capital formation increased 6.1%, and exports of goods and services increased 2.2% compared with Q2 2025.

These are provisional, seasonally adjusted volume figures published by the Hellenic Statistical Authority.

Growth is one signal. The more useful business question is where that momentum creates a realistic fit for your company.

The Smarty Solution works around market intelligence, prospecting, outreach and strategic business connections.

Explore: thesmartysolution.com

#GreeceBusiness #MarketIntelligence #BusinessDevelopment #SMEGrowth #TheSmartySolution`;

          const item={
            qaVersion:2,
            id:'tss-test-greece-q2-2026-feed',
            status:'approved',
            topic:'Greece Q2 2026 economic growth and business opportunity',
            topicKey:'greece-q2-2026-economic-growth',
            headline:'GREECE IS GROWING. BUT WHAT IS DRIVING THE MOMENTUM?',
            creativeKey:'greece-q2-2026-athens-approved-reference-feed',
            format:'feed',
            platforms:['instagram','facebook'],
            publishAt:'2026-09-20T18:30:00Z',
            requestedLocalSlot:'manual-test',
            caption,
            creative:{
              designVersion:2,
              visualStyle:'reference-data-editorial',
              compositionReady:true,
              assetFormat:'jpg',
              format:'feed',
              template:'insight-data',
              photoKey:'athens-acropolis',
              logoSha256:LOGO_SHA,
              text:{
                category:'GREECE ECONOMY',
                headline:'GREECE IS GROWING. BUT WHAT IS DRIVING THE MOMENTUM?',
                metric:'+1.9%',
                metricLabel:'REAL GDP · Q2 2026 · YEAR-ON-YEAR',
                fact1Label:'CONSUMPTION',
                fact1Body:'+1.3% YoY',
                fact2Label:'INVESTMENT',
                fact2Body:'GFCF +6.1% YoY',
                fact3Label:'EXPORTS',
                fact3Body:'Goods & services +2.2% YoY',
                location:'ATHENS · GREECE',
                source:'ELSTAT · Q2 2026'
              }
            },
            facts:{
              classification:'factual',
              claims:[
                {text:'Greece real GDP increased 1.9% year-on-year in Q2 2026.',sourceIds:['elstat-q2-2026']},
                {text:'Total final consumption expenditure increased 1.3% year-on-year in Q2 2026.',sourceIds:['elstat-q2-2026']},
                {text:'Gross fixed capital formation increased 6.1% year-on-year in Q2 2026.',sourceIds:['elstat-q2-2026']},
                {text:'Exports of goods and services increased 2.2% year-on-year in Q2 2026.',sourceIds:['elstat-q2-2026']}
              ],
              sources:[{
                id:'elstat-q2-2026',
                title:'ELSTAT: Gross domestic product, 2nd Quarter 2026',
                url:'https://www.statistics.gr/en/statistics/-/publication/SEL84/2026-Q2',
                expectedText:'Gross domestic product, 2nd Quarter 2026',
                reviewNote:'Official ELSTAT Q2 2026 release reviewed before approval. Provisional seasonally adjusted volume figures used: GDP +1.9% YoY, final consumption +1.3%, GFCF +6.1%, exports of goods and services +2.2%.',
                authorityType:'official-statistics',
                sourceType:'official-statistics',
                checkedAt:sourceChecked,
                validUntil
              }]
            },
            geography:{
              mode:'no-location-imagery',
              location:'Athens, Greece',
              photoSha256:photoSha,
              evidenceUrl:'https://commons.wikimedia.org/wiki/File:Acropolis_Parthenon_Athens_Greece.jpg',
              rights:'CC0',
              rightsUrl:'https://creativecommons.org/publicdomain/zero/1.0/',
              reviewNote:'Real Acropolis/Parthenon photograph in Athens, Greece. Wikimedia Commons identifies the file and its CC0 public-domain dedication. Used as illustrative location imagery.'
            },
            editorial:{
              version:1,
              audienceNeedIds:['entrepreneur-cross-border-fit'],
              pillar:'cyprus-economy-business',
              hook:{type:'direct-question',text:'GREECE IS GROWING. BUT WHAT IS DRIVING THE MOMENTUM?',wordCount:9},
              objective:'compare',
              cta:{id:'compare-next-market',text:'Which market deserves the next evidence check?'},
              contentFamilyId:'greece-economic-growth',
              editorialType:'trend',
              repurpose:null,
              socialProofId:null,
              trend:{candidateId:'greece-q2-2026-economic-growth',reviewedAt}
            },
            asset:{
              path:assetPath,
              sha256:hash,
              pixelHash:await imageFingerprint(bytes),
              visualSignature:await visualSignature(bytes),
              width:1080,
              height:1350,
              originFormat:'feed',
              commit:null
            }
          };

          await fs.writeFile('/tmp/item-precommit.json',JSON.stringify(item,null,2)+'\n');
          await fs.writeFile('/tmp/asset-path.txt',assetPath);
          NODE

          ASSET_PATH="$(cat /tmp/asset-path.txt)"
          git add "$ASSET_PATH"
          git commit -m "Add approved Greece Q2 2026 social asset"
          ASSET_COMMIT="$(git rev-parse HEAD)"
          export ASSET_COMMIT

          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { binding, userApprovalBinding, CHECKS, sha256 } from './social/lib/qa.js';

          const item=JSON.parse(await fs.readFile('/tmp/item-precommit.json','utf8'));
          item.asset.commit=process.env.ASSET_COMMIT;
          item.review={
            reviewer:'Hady',
            reviewedAt:new Date().toISOString(),
            assetSha256:item.asset.sha256,
            captionSha256:sha256(item.caption),
            checks:Object.fromEntries(CHECKS.map(k=>[k,true])),
            notes:'Exact 1080x1350 final asset shown to and explicitly approved by Hady in chat with the instruction “Approve and post”. Facts and primary source were checked before approval.'
          };
          item.review.boundSha256=binding(item);

          await fs.writeFile('content-queue/tss-test-greece-q2-2026-feed.json',JSON.stringify(item,null,2)+'\n');

          const policy=JSON.parse(await fs.readFile('social/user-approval-policy.json','utf8'));
          policy.approvals ||= {};
          policy.approvals[item.id]={
            approvedBy:'Hady',
            approvedAt:new Date().toISOString(),
            contentSha256:userApprovalBinding(item),
            authorizationReference:'Explicit “Approve and post” instruction in TSS social semi-automated chat on 20 September 2026.'
          };
          await fs.writeFile('social/user-approval-policy.json',JSON.stringify(policy,null,2)+'\n');

          const config=JSON.parse(await fs.readFile('social/publishing-config.json','utf8'));
          config.controlledPublicationId=item.id;
          await fs.writeFile('social/publishing-config.json',JSON.stringify(config,null,2)+'\n');
          NODE

          git add content-queue/tss-test-greece-q2-2026-feed.json social/user-approval-policy.json social/publishing-config.json
          git commit -m "Queue approved Greece test post for controlled publication"
          git push origin main
