name: Temporary dashboard mobile source assembly
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/dashboard-mobile-assembly.yml']
permissions:
  contents: read
jobs:
  assemble:
    if: github.repository == 'hadyatallah/thesmarty-solution' && github.event.pull_request.number == 45 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/tss-dashboard-consistency-20261004'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exact source transforms without backend or user-data access
        run: |
          mkdir -p evidence/mobile-assembly
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={'crm/index.html':'e4ec59acdf019e364da6f8ea3844d28a83c93262','tests/browser-dashboard.py':'1cd5837b087ea240f03ac59241c6f74faa3b6129'}
          for n,h in expected.items():
            b=Path(n).read_bytes();assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==h,n
          p=Path('crm/index.html');s=p.read_text();old='@media(max-width:520px){.quick-actions';assert s.count(old)==1;s=s.replace(old,'@media(max-width:520px){nav{flex-wrap:wrap}.quick-actions');p.write_text(s)
          p=Path('tests/browser-dashboard.py');s=p.read_text()
          changes=[("  checks={'managementOpen'", "  management_width=page.evaluate('document.documentElement.scrollWidth')\n  checks={'managementOpen'"),("   text=page.locator('main').inner_text();", "   checks['managementNoHorizontalOverflow']=management_width<=width\n   text=page.locator('main').inner_text();"),("  checks['reportsOverdue']=reports.get('Overdue tasks')=='3'", "  checks['reportsOverdue']=reports.get('Overdue tasks')=='3'\n  if variant=='patched':checks['reportsNoHorizontalOverflow']=page.evaluate('document.documentElement.scrollWidth<=innerWidth')"),("return {'variant':variant,'timezone':zone,'width':width,", "return {'variant':variant,'timezone':zone,'width':width,'managementScrollWidth':management_width,"),("results=[run(browser,'baseline','Asia/Nicosia',1280)]+", "results=[run(browser,'baseline','Asia/Nicosia',1280),run(browser,'baseline','Asia/Nicosia',390)]+"),("assert all(all(r['checks'].values()) for r in results[1:])", "assert next(r for r in results if r['variant']=='baseline' and r['width']==390)['managementScrollWidth']>390,'Baseline mobile overflow not reproduced'\nassert all(all(r['checks'].values()) for r in results if r['variant']=='patched')")]
          for a,b in changes:
            assert s.count(a)==1,a;s=s.replace(a,b,1)
          p.write_text(s)
          PY
          python -m py_compile tests/browser-dashboard.py
      - name: Store two verified source blobs only; no refs or deployment update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,os,urllib.request
          expected={'crm/index.html':'835c854dbde1f7c28bdd732b959add18a7c7bfe6ad3dd1f91d3df8f119f41cc1','tests/browser-dashboard.py':'03b78578c233f83639b2cdf2e3b098b4df79aa6436cedb5fb6fb13e43171703e'}
          for name,digest in expected.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          output=[]
          for name,digest in expected.items():
            data=Path(name).read_bytes();body=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
            request=urllib.request.Request('https://api.github.com/repos/hadyatallah/thesmarty-solution/git/blobs',data=body,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(request,timeout=30) as response:r=json.load(response)
            assert r['sha']==hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            output.append({'path':name,'sha':r['sha'],'sha256':digest})
          Path('evidence/mobile-assembly/blob-manifest.json').write_text(json.dumps(output,indent=2)+'\n');print(json.dumps(output,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-mobile-assembly
          path: evidence/mobile-assembly/
          retention-days: 14
          if-no-files-found: error
