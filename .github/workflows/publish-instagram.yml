name: Publish TSS Instagram Queue
run-name: TSS social QA and controlled publishing

on:
  push:
    branches: [main]
    paths:
      - 'content-queue/**'
      - 'social/**'
      - 'api/publish-instagram.js'
      - 'api/social-creative.js'
      - '.github/workflows/publish-instagram.yml'
      - 'package-lock.json'
  workflow_dispatch:

# A Cyprus-time schedule is added only after the dual-platform live result is inspected.
permissions:
  contents: write

concurrency:
  group: tss-instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install final-export verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng ffmpeg
      - name: Test fail-closed publishing gates
        run: node --test social/tests/*.test.js
      - name: Inspect accounts, history and the final publishing queue
        env:
          TSS_PUBLISHER_KEY: ${{ secrets.TSS_PUBLISHER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node social/scripts/process-queue.js
      - name: Check inspected QA samples without publishing
        env:
          TSS_PUBLISHER_KEY: ${{ secrets.TSS_PUBLISHER_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node social/scripts/check-samples.js
      - name: Verify final posts awaiting user approval without publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node social/scripts/check-review-batches.js
      - name: Retain QA and actual published asset evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tss-social-qa-${{ github.run_id }}
          path: social-results/
          if-no-files-found: ignore
          retention-days: 30
