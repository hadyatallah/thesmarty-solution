name: Temp promote reviewed TSS post

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-promote-reviewed-post.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Promote previously inspected feed
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { binding, sha256 } from './social/lib/qa.js';

          const draftPath = 'content-queue/2026-09-14-cyprus-lebanon-customer-problem.json';
          const samplePath = 'social/qa-samples/customer-problem-feed.json';
          const draft = JSON.parse(await fs.readFile(draftPath, 'utf8'));
          const sample = JSON.parse(await fs.readFile(samplePath, 'utf8'));

          draft.status = 'approved';
          draft.publishAt = '2026-09-19T14:15:00+03:00';
          draft.platforms = ['instagram', 'facebook'];
          draft.asset = sample.asset;
          draft.review = structuredClone(sample.review);
          delete draft.qaOnly;
          draft.review.boundSha256 = binding(draft);
          draft.review.captionSha256 = sha256(draft.caption);
          draft.review.assetSha256 = draft.asset.sha256;

          await fs.writeFile(draftPath, JSON.stringify(draft, null, 2) + '\n');
          NODE
      - name: Commit promoted queue item
        run: |
          git config user.name "TSS Social Automation"
          git config user.email "actions@users.noreply.github.com"
          git add content-queue/2026-09-14-cyprus-lebanon-customer-problem.json
          git commit -m "Queue reviewed Cyprus Lebanon feed for Sep 19"
          git push origin HEAD:main
